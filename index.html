<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A1 — Tokdie Login (WalletConnect TRON)</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#2b3138; --txt:#c9d1d9;
          --ok:#3fb950; --bad:#f85149; --warn:#d29922; --dim:#7d8590; --accent:#58a6ff; }
  * { box-sizing:border-box; }
  body { margin:0; font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;
         background:var(--bg); color:var(--txt); padding:16px; }
  .wrap { max-width:600px; margin:0 auto; }
  .panel { background:var(--panel); border:1px solid var(--line);
           border-radius:8px; padding:16px; margin-bottom:10px; }
  h1 { font-size:18px; margin:0 0 4px; }
  h2 { font-size:12px; margin:0 0 8px; color:var(--dim);
       text-transform:uppercase; letter-spacing:.08em; }
  button { background:#21262d; color:var(--txt); border:1px solid var(--line);
           border-radius:6px; padding:10px 16px; font:inherit; cursor:pointer;
           width:100%; margin:4px 0; }
  button:hover { border-color:var(--dim); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button.primary { border-color:var(--accent); color:var(--accent); }
  pre { background:#0a0d12; border:1px solid var(--line); border-radius:6px;
        padding:8px; margin:4px 0; white-space:pre-wrap; word-break:break-all;
        font-size:11px; max-height:160px; overflow:auto; }
  .kv { display:grid; grid-template-columns:110px 1fr; gap:3px 10px; margin:6px 0; }
  .kv b { color:var(--dim); font-weight:400; }
  .status { padding:8px 12px; border-radius:6px; margin:6px 0; font-size:12px; }
  .status.ok { background:#1a2f1a; color:var(--ok); }
  .status.err { background:#3a1a1a; color:var(--bad); }
  .status.warn { background:#2f2a1a; color:var(--warn); }
  .muted { color:var(--dim); font-size:11px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="panel">
    <h1>Tokdie</h1>
    <p class="muted">Sign in with your TRON wallet via WalletConnect.</p>
    <div class="kv" id="env_top"></div>
  </div>

  <div class="panel">
    <h2>step 1 — connect</h2>
    <button id="btn_connect" onclick="connect()">Connect WalletConnect</button>
  </div>

  <div class="panel">
    <h2>step 2 — sign in</h2>
    <p class="muted">Sign the message below to prove you own this wallet.</p>
    <pre id="msg_display">Welcome to Tokdie. nonce: 0xAAA</pre>
    <button class="primary" id="btn_sign" onclick="sign()" disabled>Sign in</button>
    <div class="status" id="sign_status"></div>
  </div>

  <div class="panel">
    <h2>result — copy to B</h2>
    <pre id="json_out">—</pre>
    <button id="btn_copy" onclick="copyResult()" disabled>Copy JSON</button>
    <div class="status" id="copy_status"></div>
  </div>

</div>

<script type="module">
import { UniversalProvider } from 'https://esm.sh/@walletconnect/universal-provider@2.17.0';

const DAPP_HOST = 'tokdie.github.io/drem';
const MSG = 'Welcome to Tokdie. nonce: 0xAAA';
const TRON_CHAIN = 'tron:0x2b6653dc'; // mainnet

let provider = null;
let currentAddress = null;
let lastResult = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const log = (k, m, d) => console.log(`[A ${DAPP_HOST}] [${k}] ${m}`, d || '');

const setStatus = (el, cls, text) => {
  const node = $(el);
  node.className = 'status ' + (cls || '');
  node.textContent = text;
};

function renderEnv() {
  $('env_top').innerHTML = `
    <b>dapp_host</b><span>${esc(DAPP_HOST)}</span>
    <b>provider</b><span style="color:${provider ? 'var(--ok)' : 'var(--bad)'}">${provider ? 'WalletConnect' : 'not connected'}</span>
    <b>address</b><span>${currentAddress || '—'}</span>
  `;
}

async function connect() {
  $('btn_connect').disabled = true;
  setStatus('sign_status', '', 'Opening WalletConnect…');
  try {
    provider = await UniversalProvider.init({
      projectId: 'YOUR_WALLETCONNECT_PROJECT_ID', // ← замени на свой projectId
      metadata: {
        name: 'Tokdie Login',
        description: 'Sign in with TRON',
        url: location.origin,
        icons: []
      }
    });

    // Required namespaces for TRON
    const { uri, approval } = await provider.client.connect({
      requiredNamespaces: {
        tron: {
          chains: [TRON_CHAIN],
          methods: ['tron_signMessage'],
          events: []
        }
      }
    });

    if (uri) {
      // show QR via WalletConnect modal, or simple text
      log('CONNECT', 'uri', { uri });
      setStatus('sign_status', 'warn', 'Scan QR with Trust Wallet, or open in Trust Wallet browser.');
      // In a real app, use @walletconnect/modal. For simplicity, show URI.
      // Trust Wallet deep link: trust://wc?uri=...
      const deepLink = `trust://wc?uri=${encodeURIComponent(uri)}`;
      window.location.href = deepLink; // will open Trust Wallet
    }

    const session = await approval();
    const accounts = session.namespaces.tron.accounts;
    currentAddress = accounts[0].split(':')[2];
    log('CONNECT', 'connected', { address: currentAddress });
    setStatus('sign_status', 'ok', 'Connected: ' + currentAddress);
    $('btn_sign').disabled = false;
    renderEnv();
  } catch (e) {
    log('CONNECT', 'failed', { message: e.message });
    setStatus('sign_status', 'err', 'Connect failed: ' + e.message);
    $('btn_connect').disabled = false;
  }
}

async function sign() {
  if (!provider || !currentAddress) return;
  try {
    $('btn_sign').disabled = true;
    setStatus('sign_status', '', 'Waiting for signature in Trust Wallet…');
    log('SIGN', 'tron_signMessage', { message: MSG, address: currentAddress });

    const sig = await provider.request({
      method: 'tron_signMessage',
      params: { message: MSG, address: currentAddress }
    }, TRON_CHAIN);

    log('SIGN', 'signature', { prefix: sig.slice(0, 20) + '…' });
    lastResult = { text: MSG, sig, signer: currentAddress };
    $('json_out').textContent = JSON.stringify(lastResult, null, 2);
    $('btn_copy').disabled = false;
    setStatus('sign_status', 'ok', 'Signed. Copy JSON to B.');
  } catch (e) {
    log('SIGN', 'failed', { message: e.message, code: e.code });
    setStatus('sign_status', 'err', 'Sign failed: ' + (e.message || e.code));
    $('btn_sign').disabled = false;
  }
}

async function copyResult() {
  if (!lastResult) return;
  try {
    await navigator.clipboard.writeText(JSON.stringify(lastResult, null, 2));
    setStatus('copy_status', 'ok', 'Copied. Paste in B (drem2).');
  } catch {
    setStatus('copy_status', 'err', 'Clipboard blocked — copy manually.');
  }
}

renderEnv();
log('BOOT', 'A up', { host: DAPP_HOST });
</script>
</body>
</html>
