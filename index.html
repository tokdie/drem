<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A — Tokdie Login</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#2b3138; --txt:#c9d1d9;
          --ok:#3fb950; --bad:#f85149; --warn:#d29922; --dim:#7d8590; --accent:#58a6ff; }
  * { box-sizing:border-box; }
  body { margin:0; font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;
         background:var(--bg); color:var(--txt); padding:16px; }
  .wrap { max-width:600px; margin:0 auto; }
  .panel { background:var(--panel); border:1px solid var(--line);
           border-radius:8px; padding:16px; margin-bottom:10px; }
  h1 { font-size:18px; margin:0 0 4px; }
  h2 { font-size:12px; margin:0 0 8px; color:var(--dim);
       text-transform:uppercase; letter-spacing:.08em; }
  button { background:#21262d; color:var(--txt); border:1px solid var(--line);
           border-radius:6px; padding:10px 16px; font:inherit; cursor:pointer;
           width:100%; margin:4px 0; }
  button:hover { border-color:var(--dim); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button.primary { border-color:var(--accent); color:var(--accent); }
  pre { background:#0a0d12; border:1px solid var(--line); border-radius:6px;
        padding:8px; margin:4px 0; white-space:pre-wrap; word-break:break-all;
        font-size:11px; max-height:160px; overflow:auto; }
  .kv { display:grid; grid-template-columns:130px 1fr; gap:3px 10px; margin:6px 0; }
  .kv b { color:var(--dim); font-weight:400; }
  .status { padding:8px 12px; border-radius:6px; margin:6px 0; font-size:12px; }
  .status.ok { background:#1a2f1a; color:var(--ok); }
  .status.err { background:#3a1a1a; color:var(--bad); }
  .status.warn { background:#2f2a1a; color:var(--warn); }
  .muted { color:var(--dim); font-size:11px; }

  /* DEBUG PANEL */
  #dbg { position:fixed; left:0; right:0; bottom:0; z-index:9999;
         max-height:60vh; overflow-y:auto;
         background:rgba(10,12,16,.97); border-top:2px solid var(--accent);
         color:#cdd7e0; font:11px/1.5 ui-monospace,monospace;
         padding:12px 14px; }
  #dbg.collapsed { max-height:32px; overflow:hidden; }
  #dbg h3 { margin:0 0 6px; font-size:10px; color:var(--accent);
            text-transform:uppercase; letter-spacing:.8px; cursor:pointer; }
  #dbg .row { display:grid; grid-template-columns:160px 1fr; gap:2px 10px;
              margin:1px 0; font-size:10.5px; }
  #dbg .row b { color:#8b959f; font-weight:400; }
  #dbg .row span { word-break:break-all; }
  #dbg .ok { color:var(--ok); }
  #dbg .bad { color:var(--bad); }
  #dbg .warn { color:var(--warn); }
  #dbg .log { margin-top:8px; max-height:180px; overflow-y:auto;
              background:#080c11; border:1px solid #232b34; border-radius:4px;
              padding:6px; font-size:10px; }
  #dbg .log div { margin:1px 0; }
  #dbg button { width:auto; padding:4px 10px; font-size:10.5px;
                margin:4px 4px 0 0; display:inline-block; }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h1>Tokdie</h1>
    <p class="muted">Sign in with TRON. Open this page in Trust Wallet in-app browser.</p>
    <div class="kv" id="env_top"></div>
  </div>

  <div class="panel">
    <h2>step 1 — connect</h2>
    <button id="btn_connect" onclick="connect()">Connect Trust Wallet</button>
    <div class="status" id="connect_status"></div>
  </div>

  <div class="panel">
    <h2>step 2 — sign in</h2>
    <pre id="msg_display">Welcome to Tokdie. nonce: 0xAAA</pre>
    <button class="primary" id="btn_sign" onclick="sign()" disabled>Sign in</button>
    <div class="status" id="sign_status"></div>
  </div>

  <div class="panel">
    <h2>result — copy to B</h2>
    <pre id="json_out">—</pre>
    <button id="btn_copy" onclick="copyResult()" disabled>Copy JSON</button>
    <div class="status" id="copy_status"></div>
  </div>
</div>

<!-- DEBUG PANEL -->
<div id="dbg">
  <h3 onclick="document.getElementById('dbg').classList.toggle('collapsed')">
    ▶ DEBUG · tap to collapse
  </h3>
  <div id="dbg_body">
    <div id="dbg_env"></div>
    <div class="log" id="dbg_log"></div>
    <button onclick="refreshDbg()">refresh</button>
    <button onclick="clearDbgLog()">clear log</button>
    <button onclick="copyDbg()">copy</button>
  </div>
</div>

<script type="module">
import { TrustAdapter } from 'https://esm.sh/@tronwallet-adapter-trust@1.2.0';
import { TronWeb } from 'https://esm.sh/tronweb@5.3.2';

const DAPP_HOST = 'tokdie.github.io/drem';
const MSG = 'Welcome to Tokdie. nonce: 0xAAA';

let adapter = null;
let currentAddress = null;
let lastResult = null;
const dbgLog = [];

const $ = (id) => document.getElementById(id);

const dbg = (k, m, d) => {
  const t = new Date().toISOString().slice(11,23);
  const line = `[${t}] ${k.padEnd(7)} ${m}${d ? ' · ' + JSON.stringify(d) : ''}`;
  dbgLog.push(line);
  if (dbgLog.length > 200) dbgLog.shift();
  const el = $('dbg_log');
  if (el) {
    const d = document.createElement('div');
    d.textContent = line;
    if (k === 'OK') d.className = 'ok';
    if (k === 'ERR') d.className = 'bad';
    if (k === 'WARN') d.className = 'warn';
    el.appendChild(d);
    el.scrollTop = el.scrollHeight;
  }
  console.log('[A]', k, m, d || '');
};

const setStatus = (el, cls, text) => {
  const node = $(el);
  node.className = 'status ' + (cls || '');
  node.textContent = text;
};

/* ── диагностика окружения ── */
function envSnapshot() {
  const w = window;
  const tw = w.trustwallet;
  const tronLink = tw && tw.tronLink;
  const tronWeb = tronLink && tronLink.tronWeb;

  const injected = !!(tronWeb);
  const ready = !!(tronWeb && tronWeb.ready);
  const addr = tronWeb && tronWeb.defaultAddress && tronWeb.defaultAddress.base58;

  const env = {
    // окружение
    'location.origin': location.origin,
    'location.href': location.href.slice(0, 100),
    'UA': navigator.userAgent.slice(0, 120),
    'isMobile': /iPhone|iPad|iPod|Android|Mobile/i.test(navigator.userAgent),
    'inTrustApp': /TrustWallet|Trust\/|Trust\//i.test(navigator.userAgent),
    'inTelegram': /telegram/i.test(navigator.userAgent),

    // инжект
    'window.trustwallet': tw ? 'object' : 'undefined',
    'trustwallet.tronLink': tronLink ? 'object' : 'undefined',
    'tronLink.tronWeb': tronWeb ? 'object' : 'undefined',
    'tronWeb.ready': tronWeb ? String(!!tronWeb.ready) : '—',
    'tronWeb.defaultAddress': addr ? addr : '—',
    'tronWeb.isTronLink': tronWeb ? String(!!tronWeb.isTronLink) : '—',

    // альтернативы
    'window.tron': w.tron ? 'object' : 'undefined',
    'window.tronLink': w.tronLink ? 'object' : 'undefined',

    // adapter
    'TrustAdapter': typeof TrustAdapter,
    'adapter': adapter ? 'created' : 'null',
    'adapter.address': adapter && adapter.address ? adapter.address : '—',
    'adapter.connected': adapter ? String(!!adapter.connected) : '—',

    // состояние
    'currentAddress': currentAddress || '—',
    'lastResult': lastResult ? 'set' : '—'
  };

  return { env, injected, ready, addr };
}

function renderDbg() {
  const { env, injected, ready } = envSnapshot();
  const rows = Object.entries(env).map(([k, v]) => {
    let cls = '';
    if (k.includes('trustwallet') || k.includes('tronLink') || k.includes('tronWeb') || k === 'window.tron' || k === 'window.tronLink') {
      cls = v === 'undefined' ? 'bad' : 'ok';
    }
    if (k === 'tronWeb.ready') cls = v === 'true' ? 'ok' : 'bad';
    if (k === 'adapter') cls = v === 'null' ? 'warn' : 'ok';
    return `<div class="row"><b>${k}</b><span class="${cls}">${v}</span></div>`;
  }).join('');
  $('dbg_env').innerHTML = rows;
}

function refreshDbg() {
  renderDbg();
  dbg('DEBUG', 'snapshot refreshed');
}

function clearDbgLog() {
  dbgLog.length = 0;
  $('dbg_log').innerHTML = '';
}

function copyDbg() {
  const { env } = envSnapshot();
  const txt = JSON.stringify(env, null, 2) + '\n\n' + dbgLog.join('\n');
  navigator.clipboard.writeText(txt).then(
    () => dbg('OK', 'debug copied'),
    () => dbg('ERR', 'clipboard blocked')
  );
}

/* ── env panel ── */
function renderEnv() {
  const { injected, ready, addr } = envSnapshot();
  $('env_top').innerHTML = `
    <b>dapp_host</b><span>${DAPP_HOST}</span>
    <b>in-app inject</b><span style="color:${injected ? 'var(--ok)' : 'var(--bad)'}">${injected ? 'window.trustwallet.tronLink' : 'not found'}</span>
    <b>tronWeb.ready</b><span style="color:${ready ? 'var(--ok)' : 'var(--warn)'}">${ready ? 'yes' : 'no'}</span>
    <b>address</b><span>${currentAddress || addr || '—'}</span>
  `;
}

/* ── connect с диагностикой ── */
async function connect() {
  $('btn_connect').disabled = true;
  setStatus('connect_status', '', 'Connecting…');
  dbg('CONNECT', 'start');

  const snap = envSnapshot();
  dbg('ENV', 'injected', { injected: snap.injected, ready: snap.ready, addr: snap.addr });

  // Проверка 1: инжект есть?
  if (!snap.injected) {
    dbg('ERR', 'window.trustwallet.tronLink.tronWeb is undefined');
    dbg('HINT', 'not in Trust Wallet in-app browser');
    dbg('HINT', 'current UA: ' + navigator.userAgent.slice(0, 80));
    dbg('HINT', 'open this page inside Trust Wallet → Discover');
    setStatus('connect_status', 'err',
      'Provider not injected. Open this page inside Trust Wallet in-app browser (Discover tab), not Safari/Chrome.');
    $('btn_connect').disabled = false;
    renderEnv();
    renderDbg();
    return;
  }

  // Проверка 2: tronWeb.ready?
  if (!snap.ready) {
    dbg('WARN', 'tronWeb exists but not ready — unlocking?');
    dbg('HINT', 'unlock Trust Wallet, then retry');
    // всё равно пытаемся — adapter может разбудить
  }

  // Проверка 3: создаём adapter
  try {
    dbg('ADAPTER', 'creating TrustAdapter', { openAppWithDeeplink: false });
    adapter = new TrustAdapter({ openAppWithDeeplink: false });
    dbg('ADAPTER', 'created', { hasAddress: !!adapter.address, connected: !!adapter.connected });
  } catch (e) {
    dbg('ERR', 'TrustAdapter constructor threw', { message: e.message });
    setStatus('connect_status', 'err', 'Adapter init failed: ' + e.message);
    $('btn_connect').disabled = false;
    renderEnv();
    renderDbg();
    return;
  }

  // Проверка 4: connect
  try {
    dbg('CONNECT', 'calling adapter.connect()');
    const addr = await adapter.connect();
    dbg('CONNECT', 'resolved', { addr, adapterAddress: adapter.address });

    currentAddress = addr || adapter.address;

    if (!currentAddress) {
      dbg('ERR', 'adapter.connect() returned no address');
      dbg('HINT', 'user may have rejected, or wallet locked');
      setStatus('connect_status', 'err',
        'No address returned. Check: unlocked wallet, connect approved, in-app browser.');
      $('btn_connect').disabled = false;
      renderEnv();
      renderDbg();
      return;
    }

    dbg('OK', 'connected', { address: currentAddress });
    setStatus('connect_status', 'ok', 'Connected: ' + currentAddress);
    $('btn_sign').disabled = false;
    renderEnv();
    renderDbg();
  } catch (e) {
    dbg('ERR', 'adapter.connect() threw', {
      message: e.message,
      name: e.name,
      code: e.code,
      stack: (e.stack || '').split('\n').slice(0, 3).join(' | ')
    });

    let hint = 'unknown';
    const m = String(e.message || e);
    if (/reject|denied|user/i.test(m)) hint = 'user rejected in wallet';
    else if (/lock|unlock|passcode/i.test(m)) hint = 'wallet locked — unlock Trust';
    else if (/timeout|network|fetch/i.test(m)) hint = 'network/relay timeout';
    else if (/permission|account/i.test(m)) hint = 'account permission denied';
    else if (/inject|provider|not found/i.test(m)) hint = 'provider missing — wrong browser';
    else if (/chain|network/i.test(m)) hint = 'wrong chain in wallet';

    dbg('HINT', hint);
    setStatus('connect_status', 'err', 'Connect failed: ' + (e.message || e) + ' · ' + hint);
    $('btn_connect').disabled = false;
    renderEnv();
    renderDbg();
  }
}

async function sign() {
  if (!adapter || !currentAddress) return;
  try {
    $('btn_sign').disabled = true;
    setStatus('sign_status', '', 'Signing…');
    dbg('SIGN', 'calling adapter.signMessage', { msg: MSG });

    const sig = await adapter.signMessage(MSG);
    dbg('SIGN', 'resolved', { sigPrefix: sig.slice(0, 20) + '…', len: sig.length });

    lastResult = { text: MSG, sig, signer: currentAddress };
    $('json_out').textContent = JSON.stringify(lastResult, null, 2);
    $('btn_copy').disabled = false;
    setStatus('sign_status', 'ok', 'Signed. Copy JSON to B.');
    dbg('OK', 'signed');
    renderDbg();
  } catch (e) {
    dbg('ERR', 'signMessage threw', { message: e.message, code: e.code });
    setStatus('sign_status', 'err', 'Sign failed: ' + (e.message || e));
    $('btn_sign').disabled = false;
    renderDbg();
  }
}

async function copyResult() {
  if (!lastResult) return;
  try {
    await navigator.clipboard.writeText(JSON.stringify(lastResult, null, 2));
    setStatus('copy_status', 'ok', 'Copied. Paste in B.');
  } catch {
    setStatus('copy_status', 'err', 'Clipboard blocked — copy manually.');
  }
}

/* ── boot ── */
dbg('BOOT', 'A up', { host: DAPP_HOST, origin: location.origin });
renderEnv();
renderDbg();

// авто-проверка на загрузке
setTimeout(() => {
  const snap = envSnapshot();
  if (!snap.injected) {
    dbg('WARN', 'no provider at load — you are likely NOT in Trust in-app browser');
    dbg('HINT', 'UA: ' + navigator.userAgent.slice(0, 100));
  } else if (!snap.ready) {
    dbg('WARN', 'provider injected but tronWeb.ready=false — wallet locked?');
  } else {
    dbg('OK', 'provider ready at load', { addr: snap.addr });
  }
}, 1000);
</script>
</body>
</html>
