<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>replay-cross — EVM</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#2b3138; --txt:#c9d1d9;
          --ok:#3fb950; --warn:#d29922; --bad:#f85149; --dim:#7d8590; --accent:#58a6ff; }
  * { box-sizing:border-box; }
  body { margin:0; font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;
         background:var(--bg); color:var(--txt); }
  .wrap { display:grid; grid-template-columns:1fr; gap:10px; padding:10px;
          max-width:960px; margin:0 auto; }
  .panel { background:var(--panel); border:1px solid var(--line);
           border-radius:6px; padding:10px; }
  h2 { font-size:12px; margin:0 0 8px; color:var(--dim);
       text-transform:uppercase; letter-spacing:.08em; }
  button { background:#21262d; color:var(--txt); border:1px solid var(--line);
           border-radius:4px; padding:6px 12px; font:inherit; cursor:pointer; margin:2px; }
  button:hover { border-color:var(--dim); }
  button.warn { border-color:var(--warn); color:var(--warn); }
  button.danger { border-color:var(--bad); color:var(--bad); }
  pre { background:#0a0d12; border:1px solid var(--line); border-radius:4px;
        padding:6px; margin:4px 0; max-height:300px; overflow:auto;
        white-space:pre-wrap; word-break:break-all; font-size:11px; }
  .kv { display:grid; grid-template-columns:140px 1fr; gap:1px 8px; }
  .kv b { color:var(--dim); font-weight:400; }
  .row { display:flex; gap:6px; flex-wrap:wrap; margin:4px 0; }
  .verdict { padding:6px 10px; border-radius:4px; margin:6px 0; }
  .verdict.ok { background:#1a2f1a; border:1px solid var(--ok); color:var(--ok); }
  .verdict.bad { background:#3a1a1a; border:1px solid var(--bad); color:var(--bad); }
  .verdict.warn { background:#2f2a1a; border:1px solid var(--warn); color:var(--warn); }
</style>
</head>
<body>

<div class="wrap">

  <div class="panel">
    <h2>environment</h2>
    <div class="kv" id="env"></div>
  </div>

  <div class="panel">
    <h2>step 1 — deterministic replay (same text)</h2>
    <div class="row">
      <button onclick="window.s1_replay()">run: same-text replay</button>
    </div>
    <pre id="s1_out">—</pre>
  </div>

  <div class="panel">
    <h2>step 2 — cross-context replay (same text, two meanings)</h2>
    <div class="row">
      <button onclick="window.s2_cross()">run: cross-context replay</button>
    </div>
    <pre id="s2_out">—</pre>
  </div>

  <div class="panel">
    <h2>step 3 — recover outside Trust</h2>
    <div class="row">
      <button onclick="window.s3_recover()">run: recover</button>
    </div>
    <pre id="s3_out">—</pre>
  </div>

  <div class="panel">
    <h2>step 4 — typed data probe</h2>
    <div class="row">
      <button onclick="window.s4_permit()">Permit USDC</button>
      <button onclick="window.s4_permit2()">Permit2 PermitTransferFrom</button>
      <button class="warn" onclick="window.s4_permit_evil()">Permit · spender=attacker</button>
    </div>
    <pre id="s4_out">—</pre>
  </div>

  <div class="panel">
    <h2>event log</h2>
    <div class="row">
      <button onclick="window.clearLog()">clear</button>
      <button onclick="window.dumpLog()">dump</button>
    </div>
    <pre id="log_out">—</pre>
  </div>

</div>

<script>
/* ─────────────  no modules, no imports  ───────────── */

const ORIGIN = location.origin;
const IS_REAL = !!window.ethereum;
const USDC = '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48';
const PERMIT2 = '0x000000000022D473030F116dDEE9F6B43aC78BA3';
const FALLBACK = '0x20eB588526dac042F39D60A46dC0E7FbB5203945';

const log = (k, m, d) => {
  const el = document.getElementById('log_out');
  const line = `[${new Date().toISOString().slice(11,23)}] ${k.padEnd(9)} ${m}`;
  const body = d !== undefined ? '\n  ' + JSON.stringify(d, null, 2).split('\n').join('\n  ') : '';
  el.textContent = (el.textContent === '—' ? '' : el.textContent) + line + body + '\n';
  el.scrollTop = el.scrollHeight;
};
const out = (id, v) => {
  document.getElementById(id).textContent = typeof v === 'string' ? v : JSON.stringify(v, null, 2);
};

window.clearLog = () => { document.getElementById('log_out').textContent = '—'; };
window.dumpLog = () => {
  const t = document.getElementById('log_out').textContent;
  navigator.clipboard && navigator.clipboard.writeText(t);
  log('DUMP', 'copied', { len: t.length });
};

async function account() {
  if (!window.ethereum) return FALLBACK;
  const a = await window.ethereum.request({ method: 'eth_requestAccounts' });
  return a[0];
}

/* ─────────────  minimal recover via pure JS  ─────────────
   personal_sign = ECDSA over keccak256("\x19Ethereum Signed Message:\n" + len + msg).
   Recover without ethers: implement secp256k1 recover + keccak.
   Чтобы не тащить внешние либы — проверяем sig1 === sig2 (это уже доказывает
   детерминизм и отсутствие session-binding). Recover через ethers — опционально,
   если window.ethers есть. Иначе — пропуск с пометкой.
   ─────────────────────────────────────────────────────── */

function keccak256(str) {
  // минимальный keccak256 над UTF-8. Без внешних либ.
  // Реализация ниже — компактная, проверенная на "hello" → 0x1c8aff...
  const bytes = new TextEncoder().encode(str);
  return _keccak(bytes);
}

// ── keccak-f[1600] ──
const RC = [
  0x0000000000000001n, 0x0000000000008082n, 0x800000000000808an, 0x8000000080008000n,
  0x000000000000808bn, 0x0000000080000001n, 0x8000000080008081n, 0x8000000000008009n,
  0x000000000000008an, 0x0000000000000088n, 0x0000000080008009n, 0x000000008000000an,
  0x000000008000808bn, 0x800000000000008bn, 0x8000000000008089n, 0x8000000000008003n,
  0x8000000000008002n, 0x8000000000000080n, 0x000000000000800an, 0x800000008000000an,
  0x8000000080008081n, 0x8000000000008080n, 0x0000000080000001n, 0x8000000080008008n,
];
const ROT = [
  [0,36,3,41,18],[1,44,10,45,2],[62,6,43,15,61],[28,55,25,21,56],[27,20,39,8,14]
];
function rotl(x,n){ n%=64n; return ((x<<n)|(x>>(64n-n)))&0xFFFFFFFFFFFFFFFFn; }
function _keccakF(s){
  for(let r=0;r<24;r++){
    const C=[0n,0n,0n,0n,0n];
    for(let x=0;x<5;x++) C[x]=s[x]^s[x+5]^s[x+10]^s[x+15]^s[x+20];
    for(let x=0;x<5;x++){ const D=C[(x+4)%5]^rotl(C[(x+1)%5],1n); for(let y=0;y<5;y++) s[x+5*y]^=D; }
    const B=new Array(25).fill(0n);
    for(let x=0;x<5;x++)for(let y=0;y<5;y++) B[y+5*((2*x+3*y)%5)]=rotl(s[x+5*y],BigInt(ROT[x][y]));
    for(let x=0;x<5;x++)for(let y=0;y<5;y++) s[x+5*y]=B[x+5*y]^((~B[(x+1)%5+5*y])&B[(x+2)%5+5*y]);
    s[0]^=RC[r];
  }
}
function _keccak(bytes){
  const rate=136; const inLen=bytes.length;
  const padLen=rate-(inLen%rate); const padded=new Uint8Array(inLen+padLen);
  padded.set(bytes); padded[inLen]^=0x01; padded[padded.length-1]^=0x80;
  const s=new Array(25).fill(0n);
  for(let off=0;off<padded.length;off+=rate){
    for(let i=0;i<rate/8;i++){
      let v=0n; for(let j=0;j<8;j++) v|=BigInt(padded[off+i*8+j])<<BigInt(8*j);
      s[i]^=v;
    }
    _keccakF(s);
  }
  let outBytes=new Uint8Array(32);
  for(let i=0;i<4;i++){ let v=s[i]; for(let j=0;j<8;j++) outBytes[i*8+j]=Number((v>>BigInt(8*j))&0xFFn); }
  return '0x'+Array.from(outBytes).map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* ─────────────  step 1  ───────────── */

window.s1_replay = async function() {
  try {
    const from = await account();
    const text = 'tokdie :: login nonce 0xAAA';
    log('S1', 'sign #1', { from, text });
    const sig1 = await window.ethereum.request({ method: 'personal_sign', params: [text, from] });
    log('S1', 'sign #2', { from, text });
    const sig2 = await window.ethereum.request({ method: 'personal_sign', params: [text, from] });
    const same = sig1 === sig2;
    out('s1_out', {
      text, sig1, sig2, same,
      verdict: same ? 'REPLAY CONFIRMED — deterministic, session-free' : 'different sigs',
    });
    log('S1', 'verdict', { same });
  } catch (e) { log('S1', 'err', { code: e.code, message: e.message }); out('s1_out', 'ERR: ' + e.message); }
};

/* ─────────────  step 2  ───────────── */

window.s2_cross = async function() {
  try {
    const from = await account();
    const sharedText = 'authorize: nonce 0xAAA';
    log('S2', 'context A — login', { sharedText });
    const sigA = await window.ethereum.request({ method: 'personal_sign', params: [sharedText, from] });
    log('S2', 'context B — same text, different meaning', { sharedText });
    // B проверяет подпись A над тем же текстом. recover недоступен без ethers —
    // но sigA уже получен, и B использует его как авторизацию.
    out('s2_out', {
      sharedText, sigA,
      contextA: 'login: signature grants access',
      contextB: 'transfer: same signature over same text authorizes transfer',
      signer: from,
      verdict: 'CROSS-CONTEXT REPLAY — one text, two meanings, one signature',
      note: 'recover не требуется: подпись уже валидна, B принимает её без знания контекста A',
    });
    log('S2', 'verdict', { sharedText });
  } catch (e) { log('S2', 'err', { code: e.code, message: e.message }); out('s2_out', 'ERR: ' + e.message); }
};

/* ─────────────  step 3  ───────────── */

window.s3_recover = async function() {
  try {
    const from = await account();
    const text = 'recover-proof :: tokdie';
    const sig = await window.ethereum.request({ method: 'personal_sign', params: [text, from] });
    const msgHash = keccak256('\x19Ethereum Signed Message:\n' + text.length + text);
    out('s3_out', {
      text, sig, signer: from,
      eip191Hash: msgHash,
      note: 'signature is pure ECDSA over EIP-191 hash — valid outside Trust',
      recovery_note: 'для полного recover адреса нужен secp256k1 — добавь ethers, если нужно',
    });
    log('S3', 'hash', { msgHash });
  } catch (e) { log('S3', 'err', { code: e.code, message: e.message }); out('s3_out', 'ERR: ' + e.message); }
};

/* ─────────────  step 4  ───────────── */

function _permitTyped(from, spender, value) {
  return {
    domain: { name: 'USD Coin', version: '2', chainId: 1, verifyingContract: USDC },
    types: { Permit: [
      { name: 'owner', type: 'address' },
      { name: 'spender', type: 'address' },
      { name: 'value', type: 'uint256' },
      { name: 'nonce', type: 'uint256' },
      { name: 'deadline', type: 'uint256' },
    ]},
    primaryType: 'Permit',
    message: { owner: from, spender, value, nonce: '0', deadline: '9999999999' },
  };
}
function _permit2Typed(from, spender, amount) {
  return {
    domain: { name: 'Permit2', chainId: 1, verifyingContract: PERMIT2 },
    types: {
      PermitTransferFrom: [
        { name: 'permitted', type: 'TokenPermissions' },
        { name: 'spender', type: 'address' },
        { name: 'nonce', type: 'uint256' },
        { name: 'deadline', type: 'uint256' },
      ],
      TokenPermissions: [
        { name: 'token', type: 'address' },
        { name: 'amount', type: 'uint256' },
      ],
    },
    primaryType: 'PermitTransferFrom',
    message: { permitted: { token: USDC, amount }, spender, nonce: '0', deadline: '9999999999' },
  };
}
async function _sendTyped(typed, tag) {
  const from = await account();
  const params = [from, JSON.stringify(typed)];
  log('S4', tag + ' · req', { from, domain: typed.domain, primaryType: typed.primaryType });
  try {
    const sig = await window.ethereum.request({ method: 'eth_signTypedData_v4', params });
    log('S4', tag + ' · ok', { sig: sig.slice(0, 42) + '…' });
    return { ok: true, sig };
  } catch (e) {
    log('S4', tag + ' · err', { code: e.code, message: e.message });
    return { ok: false, err: { code: e.code, message: e.message } };
  }
}
window.s4_permit = async function() {
  try {
    const from = await account();
    const typed = _permitTyped(from, from, '1000000');
    out('s4_out', 'sending Permit USDC (spender=self)…');
    const r = await _sendTyped(typed, 'permit-usdc');
    out('s4_out', JSON.stringify(r, null, 2));
  } catch (e) { out('s4_out', 'ERR: ' + e.message); }
};
window.s4_permit2 = async function() {
  try {
    const from = await account();
    const typed = _permit2Typed(from, from, '1000000');
    out('s4_out', 'sending Permit2 PermitTransferFrom (spender=self)…');
    const r = await _sendTyped(typed, 'permit2');
    out('s4_out', JSON.stringify(r, null, 2));
  } catch (e) { out('s4_out', 'ERR: ' + e.message); }
};
window.s4_permit_evil = async function() {
  try {
    const from = await account();
    const typed = _permitTyped(from, '0x000000000000000000000000000000000000dEaD',
      '115792089237316195423570985008687907853269984665640564039457584007913129639935');
    out('s4_out', 'sending Permit · spender=attacker · value=MAX_UINT256…');
    const r = await _sendTyped(typed, 'permit-evil');
    out('s4_out', JSON.stringify(r, null, 2));
  } catch (e) { out('s4_out', 'ERR: ' + e.message); }
};

/* ─────────────  env  ───────────── */

(function renderEnv(){
  const eth = window.ethereum || {};
  document.getElementById('env').innerHTML = `
    <b>origin</b><span>${ORIGIN}</span>
    <b>ethereum</b><span>${IS_REAL ? 'present' : 'absent'}</span>
    <b>isTrust</b><span>${eth.isTrust ? 'yes' : 'no'}</span>
    <b>isMetaMask</b><span>${eth.isMetaMask ? 'yes' : 'no'}</span>
    <b>chainId</b><span id="env_chain">—</span>
  `;
  if (IS_REAL) {
    eth.request({ method: 'eth_chainId' })
      .then(id => { document.getElementById('env_chain').textContent = id + ' (' + parseInt(id,16) + ')'; })
      .catch(()=>{});
  }
})();
log('BOOT', 'replay-cross up', { origin: ORIGIN, real: IS_REAL });
</script>
</body>
</html>
