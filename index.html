<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A — Tokdie Login</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#2b3138; --txt:#c9d1d9;
          --ok:#3fb950; --bad:#f85149; --warn:#d29922; --dim:#7d8590; --accent:#58a6ff; }
  * { box-sizing:border-box; }
  body { margin:0; font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;
         background:var(--bg); color:var(--txt); padding:16px; }
  .wrap { max-width:600px; margin:0 auto; }
  .panel { background:var(--panel); border:1px solid var(--line);
           border-radius:8px; padding:16px; margin-bottom:10px; }
  h1 { font-size:18px; margin:0 0 4px; }
  h2 { font-size:12px; margin:0 0 8px; color:var(--dim);
       text-transform:uppercase; letter-spacing:.08em; }
  button { background:#21262d; color:var(--txt); border:1px solid var(--line);
           border-radius:6px; padding:10px 16px; font:inherit; cursor:pointer;
           width:100%; margin:4px 0; }
  button:hover { border-color:var(--dim); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button.primary { border-color:var(--accent); color:var(--accent); }
  pre { background:#0a0d12; border:1px solid var(--line); border-radius:6px;
        padding:8px; margin:4px 0; white-space:pre-wrap; word-break:break-all;
        font-size:11px; max-height:180px; overflow:auto; }
  .kv { display:grid; grid-template-columns:110px 1fr; gap:3px 10px; margin:6px 0; }
  .kv b { color:var(--dim); font-weight:400; }
  .status { padding:8px 12px; border-radius:6px; margin:6px 0; font-size:12px; }
  .status.ok { background:#1a2f1a; color:var(--ok); }
  .status.err { background:#3a1a1a; color:var(--bad); }
  .status.warn { background:#2f2a1a; color:var(--warn); }
  .muted { color:var(--dim); font-size:11px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="panel">
    <h1>Tokdie</h1>
    <p class="muted">Sign in with your TRON wallet to continue.</p>
    <div class="kv" id="env_top"></div>
  </div>

  <div class="panel">
    <h2>step 1 — connect</h2>
    <button id="btn_connect" onclick="connect()">Connect Wallet</button>
  </div>

  <div class="panel">
    <h2>step 2 — sign in</h2>
    <p class="muted">Sign the message below to prove you own this wallet.</p>
    <pre id="msg_display">Welcome to Tokdie. nonce: 0xAAA</pre>
    <button class="primary" id="btn_sign" onclick="sign()" disabled>Sign in</button>
    <div class="status" id="sign_status"></div>
  </div>

  <div class="panel">
    <h2>result — copy to B</h2>
    <pre id="json_out">—</pre>
    <button id="btn_copy" onclick="copyResult()" disabled>Copy JSON</button>
    <div class="status" id="copy_status"></div>
  </div>

</div>

<script>
/* ─────────────  A — Tokdie login (Trust in-app browser)  ─────────────
   Provider: window.trustwallet.tronLink (Trust in-app, iOS/Android)
          or window.tronLink (generic).
   No approve, no spender, no server calls. Just signMessageV2.
   ──────────────────────────────────────────────────────────────────── */

const MSG = 'Welcome to Tokdie. nonce: 0xAAA';
let TW = { p: null, tronWeb: null, address: null };
let lastResult = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const setStatus = (el, cls, text) => {
  const n = $(el);
  n.className = 'status ' + (cls || '');
  n.textContent = text;
};

const short = (a) => a ? a.slice(0, 8) + '…' + a.slice(-6) : '—';

function findProvider() {
  if (window.trustwallet && window.trustwallet.tronLink) return window.trustwallet.tronLink;
  if (window.tronLink) return window.tronLink;
  if (window.tron && window.tron.isTronLink) return window.tron;
  return null;
}

function providerLabel() {
  if (window.trustwallet && window.trustwallet.tronLink) return 'trust-inapp';
  if (window.tronLink) return 'tronlink';
  if (window.tron && window.tron.isTronLink) return 'tron';
  return 'none';
}

function renderEnv() {
  const ready = !!(TW.p && TW.p.tronWeb && TW.p.tronWeb.ready);
  $('env_top').innerHTML = `
    <b>provider</b><span style="color:${TW.p ? 'var(--ok)' : 'var(--bad)'}">${providerLabel()}</span>
    <b>ready</b><span style="color:${ready ? 'var(--ok)' : 'var(--warn)'}">${ready ? 'yes' : 'no'}</span>
    <b>address</b><span>${esc(TW.address || '—')}</span>
  `;
}

/* waitAccounts: tron_requestAccounts + polling defaultAddress.base58 */
async function waitAccounts(p) {
  if (typeof p.request === 'function') {
    try {
      await p.request({ method: 'tron_requestAccounts' });
    } catch (e) {
      const m = String((e && e.message) || e);
      if (/reject|denied/i.test(m)) {
        setStatus('sign_status', 'warn', 'Access denied — allow access and tap again.');
      } else if (/lock|unlock|passcode/i.test(m)) {
        setStatus('sign_status', 'warn', 'Unlock your wallet first, then tap again.');
      } else {
        setStatus('sign_status', 'warn', 'Wallet response: ' + m.slice(0, 120));
      }
    }
  }
  for (let i = 0; i < 40; i++) {
    if (p.ready && p.tronWeb && p.tronWeb.defaultAddress && p.tronWeb.defaultAddress.base58) {
      return p.tronWeb.defaultAddress.base58;
    }
    await new Promise(r => setTimeout(r, 300));
  }
  if (p.tronWeb && p.tronWeb.defaultAddress && p.tronWeb.defaultAddress.base58) {
    return p.tronWeb.defaultAddress.base58;
  }
  return null;
}

async function connect() {
  $('btn_connect').disabled = true;
  setStatus('sign_status', '', 'Looking for wallet…');

  // give Trust a moment to inject
  let p = findProvider();
  const t0 = Date.now();
  while (!p && Date.now() - t0 < 3000) {
    await new Promise(r => setTimeout(r, 200));
    p = findProvider();
  }

  if (!p) {
    setStatus('sign_status', 'err',
      'Wallet not detected. Open this page in Trust Wallet in-app browser (link.trustwallet.com/open_url?coin_id=195).');
    $('btn_connect').disabled = false;
    renderEnv();
    return;
  }

  TW.p = p;
  TW.tronWeb = p.tronWeb || null;

  const addr = await waitAccounts(p);
  if (!addr) {
    setStatus('sign_status', 'warn', 'Connect timed out — tap again.');
    $('btn_connect').disabled = false;
    renderEnv();
    return;
  }

  TW.address = addr;
  setStatus('sign_status', 'ok', 'Connected: ' + short(addr));
  $('btn_sign').disabled = false;
  renderEnv();
}

async function sign() {
  if (!TW.tronWeb || !TW.address) return;
  try {
    $('btn_sign').disabled = true;
    setStatus('sign_status', '', 'Waiting for signature in wallet…');
    const sig = await TW.tronWeb.trx.signMessageV2(MSG);
    lastResult = { text: MSG, sig, signer: TW.address };
    $('json_out').textContent = JSON.stringify(lastResult, null, 2);
    $('btn_copy').disabled = false;
    setStatus('sign_status', 'ok', 'Signed. Copy JSON to B.');
  } catch (e) {
    const m = String((e && e.message) || e);
    setStatus('sign_status', 'err', 'Sign failed: ' + m.slice(0, 160));
    $('btn_sign').disabled = false;
  }
}

async function copyResult() {
  if (!lastResult) return;
  try {
    await navigator.clipboard.writeText(JSON.stringify(lastResult, null, 2));
    setStatus('copy_status', 'ok', 'Copied. Open B and paste.');
  } catch {
    setStatus('copy_status', 'err', 'Clipboard failed — select JSON above manually.');
  }
}

/* boot: try detect once, but don't auto-connect */
(async () => {
  const p = findProvider();
  if (p) {
    TW.p = p;
    TW.tronWeb = p.tronWeb || null;
  }
  renderEnv();
})();
</script>
</body>
</html>
