<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TRON surface — in-page debug</title>
<style>
  :root { --bg:#0a0d12; --panel:#11161d; --line:#232a33; --txt:#c9d1d9;
          --ok:#3fb950; --bad:#f85149; --warn:#d29922; --dim:#7d8590;
          --accent:#58a6ff; --purple:#bc8cff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--txt);
               font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;
               -webkit-text-size-adjust:100%; }
  body { padding:8px 8px calc(8px + env(safe-area-inset-bottom)); }
  h1 { font-size:14px; margin:0 0 4px; }
  h2 { font-size:11px; margin:0 0 6px; color:var(--dim);
       text-transform:uppercase; letter-spacing:.08em; }
  .panel { background:var(--panel); border:1px solid var(--line);
           border-radius:8px; padding:10px; margin-bottom:8px; }
  button { background:#1a2028; color:var(--txt); border:1px solid var(--line);
           border-radius:6px; padding:10px 12px; font:inherit; cursor:pointer;
           margin:2px 0; -webkit-user-select:none; user-select:none; }
  button:active { background:#232a33; }
  button.primary { border-color:var(--accent); color:var(--accent); font-weight:600; }
  button.danger { border-color:var(--bad); color:var(--bad); }
  button:disabled { opacity:.4; }
  .row { display:flex; gap:6px; flex-wrap:wrap; }
  .row > button { flex:1 1 auto; min-width:100px; }
  .kv { display:grid; grid-template-columns:130px 1fr; gap:2px 8px;
        font-size:11px; word-break:break-all; }
  .kv b { color:var(--dim); font-weight:400; }
  .status { padding:6px 10px; border-radius:6px; margin:6px 0; font-size:11px; }
  .status.ok { background:#0f2410; color:var(--ok); border:1px solid #1a3a1a; }
  .status.err { background:#2a1010; color:var(--bad); border:1px solid #3a1a1a; }
  .status.warn { background:#2a2410; color:var(--warn); border:1px solid #3a2f1a; }

  /* ── in-page console ── */
  #console { background:#05080c; border:1px solid var(--line); border-radius:8px;
             padding:0; margin-bottom:8px; overflow:hidden; }
  #console-bar { display:flex; gap:4px; align-items:center; padding:6px 8px;
                 background:#0a0f15; border-bottom:1px solid var(--line);
                 flex-wrap:wrap; position:sticky; top:0; z-index:2; }
  #console-bar button { padding:4px 8px; font-size:10px; margin:0; }
  #console-bar .filter { padding:3px 7px; font-size:10px; border-radius:4px;
                         border:1px solid var(--line); background:transparent;
                         color:var(--dim); cursor:pointer; }
  #console-bar .filter.active { color:var(--txt); border-color:var(--dim); background:#1a2028; }
  #console-bar .spacer { flex:1; }
  #console-count { color:var(--dim); font-size:10px; }

  #console-body { max-height:60vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
                  padding:4px 0; }
  .cl { display:block; padding:3px 8px; border-bottom:1px solid #0f141a;
        font-size:11px; line-height:1.4; word-break:break-word; }
  .cl:active { background:#0a0f15; }
  .cl .t { color:#4a5560; margin-right:6px; font-size:10px; }
  .cl .k { font-weight:600; margin-right:4px; }
  .cl.log   { color:#9aa6b2; }
  .cl.log   .k { color:#58a6ff; }
  .cl.info  { color:#9aa6b2; }
  .cl.info  .k { color:#58a6ff; }
  .cl.ok    { color:#7ec97e; }
  .cl.ok    .k { color:#3fb950; }
  .cl.warn  { color:#d4b860; }
  .cl.warn  .k { color:#d29922; }
  .cl.error { color:#f08080; }
  .cl.error .k { color:#f85149; }
  .cl.meta  { color:#a78bfa; }
  .cl.meta  .k { color:#bc8cff; }
  .cl .msg { display:inline; }
  .cl details { margin-top:2px; }
  .cl summary { color:var(--dim); cursor:pointer; font-size:10px;
                padding:2px 0; list-style:none; }
  .cl summary::-webkit-details-marker { display:none; }
  .cl summary:before { content:"▸ "; }
  .cl details[open] summary:before { content:"▾ "; }
  .cl pre { background:#0a0f15; border:1px solid var(--line); border-radius:4px;
            padding:6px; margin:4px 0 2px; font-size:10px;
            white-space:pre-wrap; word-break:break-all; max-height:300px;
            overflow:auto; }

  #json-panel pre { background:#05080c; border:1px solid var(--line);
                    border-radius:6px; padding:8px; font-size:10px;
                    white-space:pre-wrap; word-break:break-all;
                    max-height:50vh; overflow:auto; }
  .collapsible summary { cursor:pointer; color:var(--dim); font-size:11px;
                         padding:4px 0; list-style:none; }
  .collapsible summary::-webkit-details-marker { display:none; }
  .collapsible summary:before { content:"▸ "; }
  .collapsible[open] summary:before { content:"▾ "; }
</style>
</head>
<body>

<h1>TRON surface dump</h1>
<p style="color:var(--dim);font-size:10px;margin:0 0 8px">
  In-page console. All output visible below. Copy JSON when done.
</p>

<div class="panel">
  <div class="row">
    <button class="primary" onclick="runDump()" id="btn_dump">▶ RUN</button>
    <button onclick="copyJSON()" id="btn_copy" disabled>📋 JSON</button>
    <button onclick="copyLog()">📋 LOG</button>
    <button class="danger" onclick="clearAll()">✕ CLEAR</button>
  </div>
  <div class="status" id="status">ready</div>
  <div class="kv" id="env_mini"></div>
</div>

<!-- in-page console -->
<div id="console">
  <div id="console-bar">
    <button class="filter active" data-f="all" onclick="setFilter('all')">all</button>
    <button class="filter" data-f="info" onclick="setFilter('info')">info</button>
    <button class="filter" data-f="ok" onclick="setFilter('ok')">ok</button>
    <button class="filter" data-f="warn" onclick="setFilter('warn')">warn</button>
    <button class="filter" data-f="error" onclick="setFilter('error')">err</button>
    <button class="filter" data-f="meta" onclick="setFilter('meta')">meta</button>
    <span class="spacer"></span>
    <span id="console-count">0</span>
    <button onclick="clearConsole()" style="padding:3px 6px">✕</button>
  </div>
  <div id="console-body"></div>
</div>

<!-- collapsible full JSON -->
<div class="panel" id="json-panel">
  <details class="collapsible">
    <summary>collected dump (json) — tap to expand</summary>
    <pre id="json_out">—</pre>
  </details>
</div>

<script>
/* ═══════════════════════════════════════════════════════
   IN-PAGE CONSOLE
   Captures console.* AND custom log() calls.
   Renders in #console-body. Each line: time, kind, message,
   expandable JSON tree.
   ═══════════════════════════════════════════════════════ */

const Console = (() => {
  const body = document.getElementById('console-body');
  const countEl = document.getElementById('console-count');
  let filter = 'all';
  let count = 0;

  // native console preserved for real devtools (if available)
  const native = {
    log: console.log.bind(console),
    warn: console.warn.bind(console),
    error: console.error.bind(console),
    info: console.info.bind(console),
  };

  const shouldShow = (kind) => {
    if (filter === 'all') return true;
    if (filter === 'info') return kind === 'info' || kind === 'log' || kind === 'ok';
    return kind === filter;
  };

  const applyFilter = (line, kind) => {
    line.style.display = shouldShow(kind) ? '' : 'none';
  };

  const escapeHtml = (s) =>
    String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

  // pretty print with depth limit and cycle protection
  const pretty = (v, depth = 0, seen = new WeakSet(), maxDepth = 4) => {
    if (v === null) return 'null';
    if (v === undefined) return 'undefined';
    const t = typeof v;
    if (t === 'string') return JSON.stringify(v);
    if (t === 'number' || t === 'boolean') return String(v);
    if (t === 'bigint') return v.toString() + 'n';
    if (t === 'symbol') return v.toString();
    if (t === 'function') return `[fn ${v.name || 'anon'}/${v.length}]`;
    if (t === 'object') {
      if (seen.has(v)) return '[cycle]';
      if (depth >= maxDepth) return Array.isArray(v) ? `[array ${v.length}]` : `[object ${v.constructor?.name || '?'}]`;
      seen.add(v);
      try {
        if (Array.isArray(v)) {
          const items = v.slice(0, 50).map(x => pretty(x, depth + 1, seen, maxDepth));
          if (v.length > 50) items.push(`… +${v.length - 50}`);
          return '[\n  ' + items.join(',\n  ').replace(/\n/g, '\n  ') + '\n]';
        }
        const keys = Object.keys(v);
        if (keys.length === 0) return '{}';
        const items = keys.slice(0, 60).map(k => {
          let val;
          try { val = v[k]; } catch (e) { return `${k}: [getter err]`; }
          return `${k}: ${pretty(val, depth + 1, seen, maxDepth)}`;
        });
        if (keys.length > 60) items.push(`… +${keys.length - 60} keys`);
        return '{\n  ' + items.join(',\n  ').replace(/\n/g, '\n  ') + '\n}';
      } catch (e) {
        return `[unprintable: ${e.message}]`;
      } finally {
        seen.delete(v);
      }
    }
    return String(v);
  };

  const render = (kind, args) => {
    const now = new Date().toISOString().slice(11, 23);
    const line = document.createElement('div');
    line.className = 'cl ' + kind;

    const head = document.createElement('span');
    head.innerHTML = `<span class="t">${now}</span><span class="k">[${kind}]</span>`;
    line.appendChild(head);

    // first arg = short message
    const msg = document.createElement('span');
    msg.className = 'msg';
    msg.textContent = args.length && typeof args[0] === 'string'
      ? args[0]
      : args.length ? pretty(args[0], 0, new WeakSet(), 2) : '';
    line.appendChild(msg);

    // rest = expandable detail
    const details = args.slice(1).filter(a => a !== undefined);
    if (details.length) {
      const det = document.createElement('details');
      const sum = document.createElement('summary');
      sum.textContent = details.length === 1 ? 'data' : `data (${details.length})`;
      det.appendChild(sum);
      const pre = document.createElement('pre');
      pre.textContent = details.map(d => pretty(d, 0, new WeakSet(), 4)).join('\n\n');
      det.appendChild(pre);
      line.appendChild(det);
    }

    body.appendChild(line);
    applyFilter(line, kind);

    // limit DOM to last 500 lines to keep iPhone snappy
    while (body.children.length > 500) body.removeChild(body.firstChild);

    count++;
    countEl.textContent = count;
    body.scrollTop = body.scrollHeight;
  };

  const log = (kind, ...args) => {
    // mirror to native console (for Mac devtools if attached)
    (native[kind] || native.log)(...args);
    // render in page
    try { render(kind, args); } catch (e) {
      render('error', ['console render failed', { error: e.message }]);
    }
  };

  const setFilter = (f) => {
    filter = f;
    document.querySelectorAll('#console-bar .filter').forEach(b => {
      b.classList.toggle('active', b.dataset.f === f);
    });
    document.querySelectorAll('#console-body .cl').forEach(line => {
      const kind = [...line.classList].find(c => c !== 'cl');
      applyFilter(line, kind);
    });
  };

  const clear = () => {
    body.innerHTML = '';
    count = 0;
    countEl.textContent = '0';
  };

  // hook native console methods so console.log() from any code appears in-page
  ['log','info','warn','error'].forEach(k => {
    const orig = console[k].bind(console);
    console[k] = (...args) => {
      orig(...args);
      try { render(k === 'log' ? 'log' : k, args); } catch {}
    };
  });

  return { log, setFilter, clear, pretty };
})();

const log = (k, m, d) => Console.log(k, m, d);
const setFilter = (f) => Console.setFilter(f);
const clearConsole = () => Console.clear();

/* ═══════════════════════════════════════════════════════
   DUMP STATE
   ═══════════════════════════════════════════════════════ */

const DUMP = {
  meta: {}, env: {}, providers: {}, tronWebTree: {},
  tronWebMethods: {}, account: {}, chain: {},
  cookies: [], localStorage: {}, sessionStorage: {},
  indexedDB: [], memoryScan: {}, endpoints: {},
  permissions: {}, errors: [],
};

const safeGet = (fn, fb = null) => { try { return fn(); } catch (e) { return { _error: e.message }; } };

const setStatus = (cls, text) => {
  const el = document.getElementById('status');
  el.className = 'status ' + (cls || '');
  el.textContent = text;
};

/* ═══════════════════════════════════════════════════════
   COLLECTORS
   ═══════════════════════════════════════════════════════ */

function collectMeta() {
  DUMP.meta = {
    url: location.href, origin: location.origin, host: location.host,
    path: location.pathname,
    userAgent: navigator.userAgent,
    language: navigator.language, languages: navigator.languages,
    platform: navigator.platform, vendor: navigator.vendor,
    cookieEnabled: navigator.cookieEnabled,
    onLine: navigator.onLine,
    hardwareConcurrency: navigator.hardwareConcurrency,
    deviceMemory: navigator.deviceMemory,
    maxTouchPoints: navigator.maxTouchPoints,
    screen: { w: screen.width, h: screen.height, availW: screen.availWidth, availH: screen.availHeight, dpr: devicePixelRatio },
    timezone: safeGet(() => Intl.DateTimeFormat().resolvedOptions().timeZone),
    isSecureContext: window.isSecureContext,
    ios: /iPhone|iPad|iPod/.test(navigator.userAgent),
    safari: /Safari/.test(navigator.userAgent) && !/Chrome/.test(navigator.userAgent),
  };
  log('info', 'META', DUMP.meta);
  document.getElementById('env_mini').innerHTML = `
    <b>origin</b><span>${DUMP.meta.origin}</span>
    <b>UA</b><span style="font-size:10px">${DUMP.meta.userAgent.slice(0, 60)}…</span>
  `;
}

function collectEnv() {
  DUMP.env = {
    'window.tron': typeof window.tron,
    'window.tron.isTronLink': safeGet(() => window.tron?.isTronLink),
    'window.tronLink': typeof window.tronLink,
    'window.tronLink.ready': safeGet(() => window.tronLink?.ready),
    'window.tronWeb': typeof window.tronWeb,
    'window.trustwallet': typeof window.trustwallet,
    'trustwallet keys': safeGet(() => Object.keys(window.trustwallet || {})),
    'trustwallet.tron': safeGet(() => typeof window.trustwallet?.tron),
    'trustwallet.tronLink': safeGet(() => typeof window.trustwallet?.tronLink),
    'trustwallet.ethereum': safeGet(() => typeof window.trustwallet?.ethereum),
    'window.ethereum': typeof window.ethereum,
    'ethereum.isTrust': safeGet(() => window.ethereum?.isTrust),
    'ethereum.isTronLink': safeGet(() => window.ethereum?.isTronLink),
    'ethereum.isMetaMask': safeGet(() => window.ethereum?.isMetaMask),
    'ethereum.chainId': safeGet(() => window.ethereum?.chainId),
    'ethereum.selectedAddress': safeGet(() => window.ethereum?.selectedAddress),
    'ethereum.constructor': safeGet(() => window.ethereum?.constructor?.name),
    'ethereum._events': safeGet(() => window.ethereum?._events ? Object.keys(window.ethereum._events) : null),
    'ethereum._state': safeGet(() => window.ethereum?._state ? Object.keys(window.ethereum._state) : null),
  };
  log('info', 'ENV', DUMP.env);
}

function probeProviders() {
  const candidates = [
    ['window.tron', () => window.tron],
    ['window.tronLink', () => window.tronLink],
    ['window.trustwallet.tron', () => window.trustwallet?.tron],
    ['window.trustwallet.tronLink', () => window.trustwallet?.tronLink],
    ['window.tronWeb', () => window.tronWeb],
    ['trustwallet.tron.tronWeb', () => window.trustwallet?.tron?.tronWeb],
  ];
  for (const [name, get] of candidates) {
    const p = safeGet(get);
    if (!p) { DUMP.providers[name] = 'absent'; continue; }
    DUMP.providers[name] = {
      type: typeof p,
      ctor: safeGet(() => p?.constructor?.name),
      ownKeys: safeGet(() => Object.keys(p || {})),
      protoKeys: safeGet(() => Object.getOwnPropertyNames(Object.getPrototypeOf(p) || {}).filter(k => k !== 'constructor')),
      hasTronWeb: !!p?.tronWeb,
      tronWebReady: safeGet(() => p?.tronWeb?.ready),
      tronWebVersion: safeGet(() => p?.tronWeb?.version),
      hasRequest: typeof p?.request,
      hasSign: typeof p?.sign,
      hasMultiSign: typeof p?.multiSign,
      hasSignMessageV2: typeof p?.signMessageV2,
      hasSignTransaction: typeof p?.signTransaction,
      defaultAddress: safeGet(() => p?.tronWeb?.defaultAddress?.base58),
    };
  }
  log('ok', 'PROVIDERS', DUMP.providers);
}

function getTronWeb() {
  return safeGet(() =>
    window.trustwallet?.tron?.tronWeb ||
    window.tronLink?.tronWeb ||
    window.tron?.tronWeb ||
    window.tronWeb
  );
}

function collectTronWebTree() {
  const tw = getTronWeb();
  if (!tw) { log('warn', 'no tronWeb'); return; }

  const describe = (obj, depth, seen, maxDepth) => {
    if (!obj || typeof obj !== 'object' || depth > maxDepth || seen.has(obj)) return null;
    seen.add(obj);
    const out = {};
    let keys = [];
    try { keys = Object.getOwnPropertyNames(obj); } catch { return null; }
    for (const k of keys) {
      if (k === 'constructor') continue;
      let v;
      try { v = obj[k]; } catch (e) { out[k] = `[getter err]`; continue; }
      const t = typeof v;
      if (t === 'function') out[k] = `[fn/${v.length}]`;
      else if (t === 'object' && v !== null) out[k] = depth < maxDepth ? describe(v, depth + 1, seen, maxDepth) : '[depth]';
      else if (t === 'string' || t === 'number' || t === 'boolean') out[k] = v;
      else out[k] = `[${t}]`;
    }
    seen.delete(obj);
    return out;
  };

  DUMP.tronWebTree = describe(tw, 0, new WeakSet(), 3);
  log('ok', 'TRONWEB TREE', { keys: Object.keys(DUMP.tronWebTree || {}).length });
}

function collectTronWebMethods() {
  const tw = getTronWeb();
  if (!tw) { log('warn', 'no tronWeb'); return; }

  const walk = (obj, prefix, depth, seen, maxDepth) => {
    if (!obj || depth > maxDepth || seen.has(obj)) return {};
    if (typeof obj !== 'object' && typeof obj !== 'function') return {};
    seen.add(obj);
    const out = {};
    let keys = [];
    try { keys = Object.getOwnPropertyNames(obj); } catch { return {}; }
    for (const k of keys) {
      if (['constructor','caller','callee','arguments'].includes(k)) continue;
      let v;
      try { v = obj[k]; } catch { continue; }
      const path = prefix ? `${prefix}.${k}` : k;
      if (typeof v === 'function') {
        out[path] = { arity: v.length, name: v.name };
      } else if (v && typeof v === 'object' && depth < maxDepth) {
        Object.assign(out, walk(v, path, depth + 1, seen, maxDepth));
      }
    }
    seen.delete(obj);
    return out;
  };

  DUMP.tronWebMethods = walk(tw, '', 0, new WeakSet(), 3);
  const count = Object.keys(DUMP.tronWebMethods).length;
  log('ok', 'TRONWEB METHODS', { count });

  // focus: sign / permission / multi
  const focus = Object.keys(DUMP.tronWebMethods).filter(k => /sign|permission|owner|active|multi|permit/i.test(k));
  log('meta', 'sign/permission methods', focus);
}

async function collectAccountAndChain() {
  const tw = getTronWeb();
  if (!tw) { log('warn', 'no tronWeb'); return; }

  DUMP.account = {
    defaultAddress: safeGet(() => tw.defaultAddress),
    fullNode: safeGet(() => tw.fullNode?.host),
    solidityNode: safeGet(() => tw.solidityNode?.host),
    eventServer: safeGet(() => tw.eventServer?.host),
    version: safeGet(() => tw.version),
    isReady: safeGet(() => tw.ready),
  };
  log('info', 'ACCOUNT base', DUMP.account);

  const addr = safeGet(() => tw.defaultAddress?.base58);
  if (addr && tw.trx?.getAccount) {
    try {
      const acc = await tw.trx.getAccount(addr);
      DUMP.account.full = acc;
      DUMP.permissions = {
        owner: acc?.owner_permission,
        active: acc?.active_permission,
        witness: acc?.witness_permission,
      };
      log('ok', 'ACCOUNT full', {
        address: addr,
        balance_trx: acc?.balance ? acc.balance / 1e6 : 0,
        owner_permission: acc?.owner_permission,
        active_permission: acc?.active_permission,
        witness: acc?.witness_permission,
        frozen: acc?.frozen,
        votes: acc?.votes,
      });
    } catch (e) { log('error', 'getAccount error', { message: e.message }); }
  }

  try {
    if (tw.trx?.getCurrentBlock) {
      const b = await tw.trx.getCurrentBlock();
      DUMP.chain.block = {
        number: b?.block_header?.raw_data?.number,
        id: b?.blockID,
        ts: b?.block_header?.raw_data?.timestamp,
      };
      log('info', 'CHAIN block', DUMP.chain.block);
    }
  } catch (e) { log('warn', 'getCurrentBlock error', { message: e.message }); }

  try {
    if (tw.trx?.getChainParameters) {
      const p = await tw.trx.getChainParameters();
      DUMP.chain.parameters = p;
      log('ok', 'CHAIN parameters', { count: Array.isArray(p) ? p.length : '?' });
    }
  } catch (e) { log('warn', 'getChainParameters error', { message: e.message }); }
}

function collectStorage() {
  // cookies
  DUMP.cookies = document.cookie.split(';').map(c => c.trim()).filter(Boolean).map(c => {
    const [n, ...r] = c.split('=');
    const v = r.join('=');
    return { name: n, len: v.length, preview: v.slice(0, 40) };
  });
  log('info', 'COOKIES', { count: DUMP.cookies.length, names: DUMP.cookies.map(c => c.name) });

  // localStorage
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      DUMP.localStorage[k] = localStorage.getItem(k);
    }
  } catch (e) { DUMP.errors.push({ area: 'localStorage', message: e.message }); }
  log('info', 'localStorage', { count: Object.keys(DUMP.localStorage).length, keys: Object.keys(DUMP.localStorage) });

  // sessionStorage
  try {
    for (let i = 0; i < sessionStorage.length; i++) {
      const k = sessionStorage.key(i);
      DUMP.sessionStorage[k] = sessionStorage.getItem(k);
    }
  } catch (e) { DUMP.errors.push({ area: 'sessionStorage', message: e.message }); }
  log('info', 'sessionStorage', { count: Object.keys(DUMP.sessionStorage).length, keys: Object.keys(DUMP.sessionStorage) });

  // indexedDB
  try {
    if (indexedDB.databases) {
      indexedDB.databases().then(dbs => {
        DUMP.indexedDB = dbs.map(d => ({ name: d.name, version: d.version }));
        log('info', 'indexedDB', DUMP.indexedDB);
      }).catch(e => { DUMP.errors.push({ area: 'indexedDB', message: e.message }); });
    }
  } catch (e) { DUMP.errors.push({ area: 'indexedDB', message: e.message }); }
}

function scanMemory() {
  // walk window own keys, 2 levels
  const result = {};
  const seen = new WeakSet();
  const walk = (obj, prefix, depth, maxDepth) => {
    if (!obj || depth > maxDepth || seen.has(obj)) return;
    if (typeof obj !== 'object' && typeof obj !== 'function') return;
    seen.add(obj);
    let keys = [];
    try { keys = Object.getOwnPropertyNames(obj); } catch { return; }
    for (const k of keys) {
      if (['constructor','caller','callee','arguments'].includes(k)) continue;
      if (k.startsWith('__')) continue;
      const path = prefix ? `${prefix}.${k}` : k;
      let v;
      try { v = obj[k]; } catch (e) { result[path] = `[getter err]`; continue; }
      const t = typeof v;
      if (t === 'function') result[path] = `[fn/${v.length}]`;
      else if (t === 'object' && v !== null) {
        if (depth < maxDepth) walk(v, path, depth + 1, maxDepth);
        result[path] = `[object ${v.constructor?.name || '?'}]`;
      } else if (t === 'string' || t === 'number' || t === 'boolean') {
        result[path] = v;
      } else result[path] = `[${t}]`;
    }
    seen.delete(obj);
  };
  walk(window, 'window', 0, 2);
  DUMP.memoryScan = result;
  log('ok', 'MEMORY window tree', { paths: Object.keys(result).length });
}

async function tryRpcCalls() {
  const tw = getTronWeb();
  if (!tw?.trx) { log('warn', 'no trx'); return; }
  const calls = [
    ['getCurrentBlock', () => tw.trx.getCurrentBlock()],
    ['getChainParameters', () => tw.trx.getChainParameters()],
    ['getNodeInfo', () => tw.trx.getNodeInfo()],
    ['getBlockByNumber', () => tw.trx.getBlockByNumber(1)],
  ];
  DUMP.rpc = {};
  for (const [name, fn] of calls) {
    try {
      const r = await fn();
      DUMP.rpc[name] = { ok: true, keys: typeof r === 'object' ? Object.keys(r).slice(0, 12) : String(r) };
      log('ok', 'RPC ' + name, DUMP.rpc[name]);
    } catch (e) {
      DUMP.rpc[name] = { ok: false, error: e.message };
      log('warn', 'RPC ' + name + ' error', { message: e.message });
    }
  }
}

async function probeEndpoints() {
  const candidates = [
    ['trongrid-fullnode', 'https://api.trongrid.io/wallet/getnowblock'],
    ['trongrid-solidity', 'https://api.trongrid.io/walletsolidity/getnowblock'],
    ['trongrid-event', 'https://api.trongrid.io/event/eventquery'],
    ['trust-api', 'https://api.trustwallet.com/'],
    ['trust-v2', 'https://api.trustwallet.com/v2/'],
    ['trust-config', 'https://config.trustwallet.com/'],
    ['trust-scan', 'https://api.trustwallet.com/scan/'],
    ['trust-aml', 'https://api.trustwallet.com/aml/'],
  ];
  DUMP.endpoints = {};
  for (const [name, url] of candidates) {
    try {
      const t0 = performance.now();
      const r = await fetch(url, { method: 'GET', mode: 'cors', credentials: 'omit', cache: 'no-store' });
      DUMP.endpoints[name] = {
        url, status: r.status, ok: r.ok, type: r.type,
        headers: Object.fromEntries(r.headers.entries()),
        ms: Math.round(performance.now() - t0),
      };
      log(r.ok ? 'ok' : 'warn', 'ENDPOINT ' + name, { status: r.status, ms: DUMP.endpoints[name].ms });
    } catch (e) {
      DUMP.endpoints[name] = { url, error: e.message };
      log('warn', 'ENDPOINT ' + name + ' error', { message: e.message });
    }
  }
}

async function runDump() {
  const btn = document.getElementById('btn_dump');
  btn.disabled = true;
  setStatus('warn', 'running…');
  clearConsole();

  const t0 = performance.now();
  try {
    collectMeta();
    collectEnv();
    probeProviders();
    collectTronWebTree();
    collectTronWebMethods();
    await collectAccountAndChain();
    collectStorage();
    scanMemory();
    await tryRpcCalls();
    await probeEndpoints();

    DUMP.meta.dumpMs = Math.round(performance.now() - t0);
    document.getElementById('json_out').textContent = Console.pretty(DUMP, 0, new WeakSet(), 5);
    document.getElementById('btn_copy').disabled = false;
    setStatus('ok', `done in ${DUMP.meta.dumpMs}ms · ${Object.keys(DUMP).length} sections`);
    log('ok', 'DUMP COMPLETE', { ms: DUMP.meta.dumpMs });
  } catch (e) {
    DUMP.errors.push({ area: 'runDump', message: e.message, stack: e.stack });
    setStatus('err', 'error: ' + e.message);
    log('error', 'DUMP FAILED', { message: e.message, stack: e.stack });
  } finally {
    btn.disabled = false;
  }
}
