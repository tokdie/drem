<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A — Tokdie Login</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#2b3138; --txt:#c9d1d9;
          --ok:#3fb950; --bad:#f85149; --dim:#7d8590; }
  * { box-sizing:border-box; }
  body { margin:0; font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;
         background:var(--bg); color:var(--txt); padding:20px; }
  .wrap { max-width:560px; margin:0 auto; }
  .panel { background:var(--panel); border:1px solid var(--line);
           border-radius:8px; padding:20px; margin-bottom:12px; }
  h1 { font-size:18px; margin:0 0 4px; }
  h2 { font-size:12px; margin:0 0 8px; color:var(--dim);
       text-transform:uppercase; letter-spacing:.08em; }
  button { background:#21262d; color:var(--txt); border:1px solid var(--line);
           border-radius:6px; padding:10px 18px; font:inherit; cursor:pointer;
           width:100%; margin:6px 0; }
  button:hover { border-color:var(--dim); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  pre { background:#0a0d12; border:1px solid var(--line); border-radius:6px;
        padding:10px; margin:6px 0; white-space:pre-wrap; word-break:break-all;
        font-size:11px; max-height:200px; overflow:auto; }
  .kv { display:grid; grid-template-columns:90px 1fr; gap:3px 10px; margin:6px 0; }
  .kv b { color:var(--dim); font-weight:400; }
  .status { padding:6px 10px; border-radius:6px; margin:8px 0; font-size:12px; }
  .status.ok { background:#1a2f1a; color:var(--ok); }
  .status.err { background:#3a1a1a; color:var(--bad); }
  .muted { color:var(--dim); font-size:11px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="panel">
    <h1>Tokdie</h1>
    <p class="muted">Sign in with your TRON wallet to continue.</p>
  </div>

  <div class="panel">
    <h2>step 1 — connect</h2>
    <button id="btn_connect" onclick="connect()">Connect TronLink</button>
    <div class="kv" id="env"></div>
  </div>

  <div class="panel">
    <h2>step 2 — sign in</h2>
    <p class="muted">Sign the message below to prove you own this wallet.</p>
    <pre id="msg_display">Welcome to Tokdie. nonce: 0xAAA</pre>
    <button id="btn_sign" onclick="sign()" disabled>Sign in</button>
    <div class="status" id="sign_status"></div>
  </div>

  <div class="panel">
    <h2>result — copy to B</h2>
    <div class="kv" id="result"></div>
    <button id="btn_copy" onclick="copyResult()" disabled>Copy (text + sig + signer)</button>
  </div>

</div>

<script>
/* ─────────────  A — legitimate login  ─────────────
   TronLink injects window.tron with tronWeb.
   Detect via TIP-6963, request accounts, signMessageV2.
   ───────────────────────────────────────────────── */

let tronProvider = null;
let tronWeb = null;
let currentAddress = null;

const MSG = 'Welcome to Tokdie. nonce: 0xAAA';

const $ = (id) => document.getElementById(id);

const log = (k, m, d) => {
  console.log(`[${k}] ${m}`, d || '');
};

const setStatus = (el, cls, text) => {
  const node = $(el);
  node.className = 'status ' + cls;
  node.textContent = text;
};

/* TIP-6963 detect */
window.addEventListener('TIP6963:announceProvider', (e) => {
  if (e.detail && e.detail.info && e.detail.info.name === 'TronLink') {
    tronProvider = e.detail.provider;
    log('DETECT', 'TronLink announced via TIP-6963');
  }
});
window.dispatchEvent(new Event('TIP6963:requestProvider'));

/* fallback: legacy window.tron */
if (!tronProvider && window.tron && window.tron.isTronLink) {
  tronProvider = window.tron;
  log('DETECT', 'TronLink via window.tron');
}

function renderEnv() {
  const e = tronProvider || {};
  $('env').innerHTML = `
    <b>provider</b><span>${tronProvider ? 'TronLink' : 'not found'}</span>
    <b>isTronLink</b><span>${e.isTronLink ? 'yes' : 'no'}</span>
    <b>ready</b><span>${e.tronWeb && e.tronWeb.ready ? 'yes' : 'no'}</span>
    <b>address</b><span>${currentAddress || '—'}</span>
  `;
}

async function connect() {
  if (!tronProvider) {
    setStatus('sign_status', 'err', 'TronLink not detected. Install TronLink extension.');
    return;
  }
  try {
    $('btn_connect').disabled = true;
    const accounts = await tronProvider.request({ method: 'eth_requestAccounts' });
    currentAddress = accounts[0];
    tronWeb = tronProvider.tronWeb;
    log('CONNECT', 'account', { address: currentAddress });
    $('btn_sign').disabled = false;
    renderEnv();
  } catch (e) {
    log('CONNECT', 'failed', e);
    setStatus('sign_status', 'err', 'Connect failed: ' + (e.message || e.code));
    $('btn_connect').disabled = false;
  }
}

async function sign() {
  if (!tronWeb || !currentAddress) return;
  try {
    $('btn_sign').disabled = true;
    setStatus('sign_status', '', 'Waiting for signature…');
    log('SIGN', 'requesting signMessageV2', { message: MSG });
    const sig = await tronWeb.trx.signMessageV2(MSG);
    log('SIGN', 'signature received', { sig });
    $('result').innerHTML = `
      <b>text</b><span>${esc(MSG)}</span>
      <b>sig</b><span style="word-break:break-all">${sig}</span>
      <b>signer</b><span>${currentAddress}</span>
    `;
    $('btn_copy').disabled = false;
    setStatus('sign_status', 'ok', 'Signed. Copy result to B.');
  } catch (e) {
    log('SIGN', 'failed', e);
    setStatus('sign_status', 'err', 'Sign failed: ' + (e.message || e.code));
    $('btn_sign').disabled = false;
  }
}

async function copyResult() {
  const sig = $('result').querySelector('span:nth-child(4)')?.textContent;
  const payload = JSON.stringify({ text: MSG, sig, signer: currentAddress }, null, 2);
  try {
    await navigator.clipboard.writeText(payload);
    setStatus('sign_status', 'ok', 'Copied to clipboard. Paste in B.');
  } catch {
    setStatus('sign_status', 'err', 'Clipboard failed — copy manually from result panel.');
  }
}

const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

renderEnv();
log('BOOT', 'A up', { origin: location.origin });
</script>
</body>
</html>
