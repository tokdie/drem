<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>in-app surface</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#2b3138; --txt:#c9d1d9;
          --ok:#3fb950; --bad:#f85149; --dim:#7d8590; }
  * { box-sizing:border-box; }
  body { margin:0; font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;
         background:var(--bg); color:var(--txt); padding:12px; }
  .wrap { max-width:760px; margin:0 auto; }
  .panel { background:var(--panel); border:1px solid var(--line);
           border-radius:8px; padding:12px; margin-bottom:10px; }
  h2 { font-size:11px; margin:0 0 6px; color:var(--dim);
       text-transform:uppercase; letter-spacing:.08em; }
  pre { background:#0a0d12; border:1px solid var(--line); border-radius:6px;
        padding:8px; margin:4px 0; white-space:pre-wrap; word-break:break-all;
        font-size:11px; max-height:220px; overflow:auto; }
  .ok { color:var(--ok); }
  .bad { color:var(--bad); }
  .dim { color:var(--dim); }
  button { background:#21262d; color:var(--txt); border:1px solid var(--line);
           border-radius:4px; padding:6px 12px; font:inherit; cursor:pointer;
           margin:2px; }
</style>
</head>
<body>
<div class="wrap">

<div class="panel">
  <h2>in-app webview — what JS can reach</h2>
  <button onclick="scan()">scan surface</button>
  <button onclick="probeBridge()">probe bridges</button>
  <button onclick="probeStorage()">probe storage</button>
  <button onclick="probeNetwork()">probe network</button>
  <button onclick="clearAll()">clear</button>
  <pre id="out">—</pre>
</div>

<div class="panel">
  <h2>log</h2>
  <pre id="log">—</pre>
</div>

</div>

<script>
/* ─────────────  in-app WebView surface probe  ─────────────
   Runs inside Trust in-app browser.
   Maps: globals, bridges, storage, network reach, sandbox edges.
   No breakout. Just what JS can touch.
   ────────────────────────────────────────────────────────── */

const $ = (id) => document.getElementById(id);
const out = (s) => {
  const el = $('out');
  el.textContent = (el.textContent === '—' ? '' : el.textContent) + s + '\n';
  el.scrollTop = el.scrollHeight;
};
const log = (k, m, d) => {
  const el = $('log');
  const line = `[${new Date().toISOString().slice(11,23)}] ${k} ${m}`;
  const body = d !== undefined ? '\n  ' + JSON.stringify(d, null, 2).split('\n').join('\n  ') : '';
  el.textContent = (el.textContent === '—' ? '' : el.textContent) + line + body + '\n';
  el.scrollTop = el.scrollHeight;
};

const clearAll = () => { $('out').textContent = '—'; $('log').textContent = '—'; };

/* ─────────────  globals  ───────────── */

function scan() {
  const g = {
    'window.trustwallet': typeof window.trustwallet,
    'window.ethereum': typeof window.ethereum,
    'window.tron': typeof window.tron,
    'window.tronLink': typeof window.tronLink,
    'window.tronWeb': typeof window.tronWeb,
    'window.phantom': typeof window.phantom,
    'window.solana': typeof window.solana,
    'window.keplr': typeof window.keplr,
    'window.cosmos': typeof window.cosmos,
    'window.ReactNativeWebView': typeof window.ReactNativeWebView,
    'window.webkit': typeof window.webkit,
    'window.Android': typeof window.Android,
    'window.postMessage': typeof window.postMessage,
    'window.localStorage': typeof localStorage,
    'window.sessionStorage': typeof sessionStorage,
    'window.indexedDB': typeof indexedDB,
    'window.crypto': typeof crypto,
    'window.Worker': typeof Worker,
    'window.SharedWorker': typeof SharedWorker,
    'window.ServiceWorker': typeof navigator.serviceWorker,
    'window.XMLHttpRequest': typeof XMLHttpRequest,
    'window.fetch': typeof fetch,
    'window.WebSocket': typeof WebSocket,
    'window.eval': typeof eval,
    'window.Function': typeof Function,
  };
  out(JSON.stringify(g, null, 2));
  log('SCAN', 'globals', g);
}

/* ─────────────  bridges  ───────────── */

function probeBridge() {
  const bridges = {};
  if (window.trustwallet) {
    bridges.trustwallet = Object.keys(window.trustwallet);
    bridges.trustwalletProto = Object.getOwnPropertyNames(
      Object.getPrototypeOf(window.trustwallet)
    ).slice(0, 20);
  }
  if (window.ReactNativeWebView) {
    bridges.ReactNativeWebView = Object.keys(window.ReactNativeWebView);
  }
  if (window.webkit?.messageHandlers) {
    bridges.webkitMessageHandlers = Object.keys(window.webkit.messageHandlers);
  }
  if (window.Android) {
    bridges.Android = Object.getOwnPropertyNames(window.Android).slice(0, 20);
  }
  out('bridges:\n' + JSON.stringify(bridges, null, 2));
  log('BRIDGE', 'probed', bridges);
}

/* ─────────────  storage  ───────────── */

function probeStorage() {
  const s = {
    localStorageLen: localStorage.length,
    localStorageKeys: Object.keys(localStorage),
    sessionStorageLen: sessionStorage.length,
    sessionStorageKeys: Object.keys(sessionStorage),
    cookieEnabled: navigator.cookieEnabled,
    cookie: document.cookie ? document.cookie.slice(0, 80) : '',
  };
  out('storage:\n' + JSON.stringify(s, null, 2));
  log('STORAGE', 'probed', s);
}

/* ─────────────  network  ───────────── */

async function probeNetwork() {
  const results = {};
  // try fetch to same origin
  try {
    const r = await fetch(location.href, { method: 'HEAD' });
    results.sameOriginFetch = { ok: true, status: r.status };
  } catch (e) {
    results.sameOriginFetch = { ok: false, err: e.message };
  }
  // try fetch to external
  try {
    const r = await fetch('https://httpbin.org/get', { method: 'HEAD', mode: 'cors' });
    results.crossOriginFetch = { ok: true, status: r.status };
  } catch (e) {
    results.crossOriginFetch = { ok: false, err: e.message };
  }
  out('network:\n' + JSON.stringify(results, null, 2));
  log('NET', 'probed', results);
}

/* ─────────────  boot  ───────────── */

log('BOOT', 'surface probe up', { origin: location.origin, ua: navigator.userAgent });
scan();
</script>
</body>
</html>
