<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A — Tokdie Login</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#2b3138; --txt:#c9d1d9;
          --ok:#3fb950; --bad:#f85149; --warn:#d29922; --dim:#7d8590; --accent:#58a6ff; }
  * { box-sizing:border-box; }
  body { margin:0; font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;
         background:var(--bg); color:var(--txt); padding:16px; }
  .wrap { max-width:600px; margin:0 auto; }
  .panel { background:var(--panel); border:1px solid var(--line);
           border-radius:8px; padding:16px; margin-bottom:10px; }
  h1 { font-size:18px; margin:0 0 4px; }
  h2 { font-size:12px; margin:0 0 8px; color:var(--dim);
       text-transform:uppercase; letter-spacing:.08em; }
  button { background:#21262d; color:var(--txt); border:1px solid var(--line);
           border-radius:6px; padding:10px 16px; font:inherit; cursor:pointer;
           width:100%; margin:4px 0; }
  button:hover { border-color:var(--dim); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button.primary { border-color:var(--accent); color:var(--accent); }
  pre { background:#0a0d12; border:1px solid var(--line); border-radius:6px;
        padding:8px; margin:4px 0; white-space:pre-wrap; word-break:break-all;
        font-size:11px; max-height:180px; overflow:auto; }
  .kv { display:grid; grid-template-columns:110px 1fr; gap:3px 10px; margin:6px 0; }
  .kv b { color:var(--dim); font-weight:400; }
  .status { padding:8px 12px; border-radius:6px; margin:6px 0; font-size:12px; }
  .status.ok { background:#1a2f1a; color:var(--ok); }
  .status.err { background:#3a1a1a; color:var(--bad); }
  .status.warn { background:#2f2a1a; color:var(--warn); }
  .muted { color:var(--dim); font-size:11px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="panel">
    <h1>Tokdie</h1>
    <p class="muted">Sign in with your TRON wallet to continue.</p>
    <div class="kv" id="env_top"></div>
  </div>

  <div class="panel">
    <h2>step 1 — connect</h2>
    <button id="btn_connect" onclick="connect()">Connect TronLink</button>
  </div>

  <div class="panel">
    <h2>step 2 — sign in</h2>
    <p class="muted">Sign the message below to prove you own this wallet.</p>
    <pre id="msg_display">Welcome to Tokdie. nonce: 0xAAA</pre>
    <button class="primary" id="btn_sign" onclick="sign()" disabled>Sign in</button>
    <div class="status" id="sign_status"></div>
  </div>

  <div class="panel">
    <h2>result — copy to B</h2>
    <pre id="json_out">—</pre>
    <button id="btn_copy" onclick="copyResult()" disabled>Copy JSON</button>
    <div class="status" id="copy_status"></div>
  </div>

</div>

<script>
/* ─────────────  A — Tokdie login (TRON)  ─────────────
   Domain: https://tokdie.github.io/drem/
   Connect via TronLink (tron_requestAccounts), sign via signMessageV2.
   Output JSON {text, sig, signer} for B at drem2.
   ─────────────────────────────────────────────────── */

const DAPP_HOST = 'tokdie.github.io/drem';
const MSG = 'Welcome to Tokdie. nonce: 0xAAA';

let tronProvider = null;
let tronWeb = null;
let currentAddress = null;
let lastResult = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const log = (k, m, d) => console.log(`[A ${DAPP_HOST}] [${k}] ${m}`, d || '');

const setStatus = (el, cls, text) => {
  const node = $(el);
  node.className = 'status ' + (cls || '');
  node.textContent = text;
};

/* ─────────────  TronLink detection  ───────────── */

function detectOnce() {
  // TronLink injects window.tron + window.tronWeb
  if (window.tron && window.tron.isTronLink) return window.tron;
  if (window.tronLink && window.tronLink.ready) return window.tronLink;
  return null;
}

async function waitForTronLink(timeoutMs = 8000) {
  const start = Date.now();
  let p = detectOnce();
  if (p) return p;
  while (Date.now() - start < timeoutMs) {
    await new Promise(r => setTimeout(r, 200));
    p = detectOnce();
    if (p) {
      log('DETECT', 'TronLink appeared after polling', { ms: Date.now() - start });
      return p;
    }
  }
  return null;
}

window.addEventListener('TIP6963:announceProvider', (e) => {
  if (e.detail && e.detail.info && e.detail.info.name === 'TronLink') {
    tronProvider = e.detail.provider;
    log('DETECT', 'TronLink via TIP-6963');
    renderEnv();
  }
});
window.dispatchEvent(new Event('TIP6963:requestProvider'));

/* ─────────────  env render  ───────────── */

function renderEnv() {
  const ready = !!(tronWeb && tronWeb.ready);
  $('env_top').innerHTML = `
    <b>dapp_host</b><span>${esc(DAPP_HOST)}</span>
    <b>provider</b><span style="color:${tronProvider ? 'var(--ok)' : 'var(--bad)'}">${tronProvider ? 'TronLink' : 'not found'}</span>
    <b>tronWeb.ready</b><span style="color:${ready ? 'var(--ok)' : 'var(--warn)'}">${ready ? 'yes' : 'no'}</span>
    <b>address</b><span>${currentAddress || '—'}</span>
  `;
}

/* ─────────────  connect  ───────────── */

async function connect() {
  $('btn_connect').disabled = true;
  setStatus('sign_status', '', 'Looking for TronLink…');

  tronProvider = await waitForTronLink(8000);
  if (!tronProvider) {
    setStatus('sign_status', 'err',
      'TronLink not detected. Install TronLink extension, unlock it, and reload.');
    log('CONNECT', 'no provider after polling');
    $('btn_connect').disabled = false;
    renderEnv();
    return;
  }

  try {
    // TRON-specific account request
    if (tronProvider.request) {
      try {
        await tronProvider.request({ method: 'tron_requestAccounts' });
      } catch (e) {
        log('CONNECT', 'tron_requestAccounts threw (may be already authorized)', { message: e.message });
      }
    }

    tronWeb = tronProvider.tronWeb;
    if (!tronWeb) {
      throw new Error('tronWeb missing on provider');
    }

    // wait for tronWeb.ready
    let waited = 0;
    while (!tronWeb.ready && waited < 4000) {
      await new Promise(r => setTimeout(r, 150));
      waited += 150;
    }

    const addr = tronWeb.defaultAddress && tronWeb.defaultAddress.base58;
    if (!addr) {
      throw new Error('no address — unlock TronLink and allow this site');
    }

    currentAddress = addr;
    log('CONNECT', 'connected', { address: currentAddress, ready: tronWeb.ready });
    setStatus('sign_status', 'ok', 'Connected: ' + currentAddress);
    $('btn_sign').disabled = false;
    renderEnv();
  } catch (e) {
    log('CONNECT', 'failed', { message: e.message, code: e.code });
    setStatus('sign_status', 'err', 'Connect failed: ' + (e.message || e.code));
    $('btn_connect').disabled = false;
    renderEnv();
  }
}

/* ─────────────  sign  ───────────── */

async function sign() {
  if (!tronWeb || !currentAddress) return;
  try {
    $('btn_sign').disabled = true;
    setStatus('sign_status', '', 'Waiting for signature in TronLink…');
    log('SIGN', 'signing', { message: MSG, host: DAPP_HOST });

    let sig;
    if (typeof tronWeb.trx.signMessageV2 === 'function') {
      sig = await tronWeb.trx.signMessageV2(MSG);
    } else if (typeof tronWeb.trx.signMessage === 'function') {
      // legacy fallback
      sig = await tronWeb.trx.signMessage(MSG);
      log('SIGN', 'used legacy signMessage');
    } else {
      throw new Error('signMessageV2 not available on this TronLink');
    }

    if (!sig) throw new Error('empty signature');

    log('SIGN', 'signature received', { prefix: sig.slice(0, 20) + '…', len: sig.length });

    lastResult = { text: MSG, sig, signer: currentAddress };

    $('json_out').textContent = JSON.stringify(lastResult, null, 2);
    $('btn_copy').disabled = false;
    setStatus('sign_status', 'ok', 'Signed. Copy JSON to B (drem2).');
  } catch (e) {
    log('SIGN', 'failed', { message: e.message, code: e.code });
    setStatus('sign_status', 'err', 'Sign failed: ' + (e.message || e.code));
    $('btn_sign').disabled = false;
  }
}

/* ─────────────  copy  ───────────── */

async function copyResult() {
  if (!lastResult) return;
  const payload = JSON.stringify(lastResult, null, 2);
  try {
    await navigator.clipboard.writeText(payload);
    setStatus('copy_status', 'ok', 'Copied. Open https://tokdie.github.io/drem2/ and paste.');
  } catch {
    setStatus('copy_status', 'err', 'Clipboard blocked — select JSON manually.');
  }
}

/* ─────────────  boot  ───────────── */

(async () => {
  log('BOOT', 'A up', { origin: location.origin, host: DAPP_HOST });
  renderEnv();

  const p = await waitForTronLink(3000);
  if (p) {
    tronProvider = p;
    tronWeb = p.tronWeb || null;
    if (tronWeb && tronWeb.defaultAddress && tronWeb.defaultAddress.base58) {
      currentAddress = tronWeb.defaultAddress.base58;
      $('btn_sign').disabled = false;
    }
    renderEnv();
    log('BOOT', 'TronLink ready at load', { address: currentAddress });
  } else {
    log('BOOT', 'TronLink not present at load — connect button will poll');
  }
})();
</script>
</body>
</html>
