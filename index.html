<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A — Tokdie Login</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#2b3138; --txt:#c9d1d9;
          --ok:#3fb950; --bad:#f85149; --warn:#d29922; --dim:#7d8590; --accent:#58a6ff; }
  * { box-sizing:border-box; }
  body { margin:0; font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;
         background:var(--bg); color:var(--txt); padding:16px; }
  .wrap { max-width:600px; margin:0 auto; }
  .panel { background:var(--panel); border:1px solid var(--line);
           border-radius:8px; padding:16px; margin-bottom:10px; }
  h1 { font-size:18px; margin:0 0 4px; }
  h2 { font-size:12px; margin:0 0 8px; color:var(--dim);
       text-transform:uppercase; letter-spacing:.08em; }
  button { background:#21262d; color:var(--txt); border:1px solid var(--line);
           border-radius:6px; padding:10px 16px; font:inherit; cursor:pointer;
           width:100%; margin:4px 0; }
  button:hover { border-color:var(--dim); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button.primary { border-color:var(--accent); color:var(--accent); }
  pre { background:#0a0d12; border:1px solid var(--line); border-radius:6px;
        padding:8px; margin:4px 0; white-space:pre-wrap; word-break:break-all;
        font-size:11px; max-height:160px; overflow:auto; }
  .kv { display:grid; grid-template-columns:110px 1fr; gap:3px 10px; margin:6px 0; }
  .kv b { color:var(--dim); font-weight:400; }
  .status { padding:8px 12px; border-radius:6px; margin:6px 0; font-size:12px; }
  .status.ok { background:#1a2f1a; color:var(--ok); }
  .status.err { background:#3a1a1a; color:var(--bad); }
  .status.warn { background:#2f2a1a; color:var(--warn); }
  .muted { color:var(--dim); font-size:11px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h1>Tokdie</h1>
    <p class="muted">Sign in with TRON. Open this page in Trust Wallet in-app browser.</p>
    <div class="kv" id="env_top"></div>
  </div>

  <div class="panel">
    <h2>step 1 — connect</h2>
    <button id="btn_connect" onclick="connect()">Connect Trust Wallet</button>
    <div class="status" id="connect_status"></div>
  </div>

  <div class="panel">
    <h2>step 2 — sign in</h2>
    <pre id="msg_display">Welcome to Tokdie. nonce: 0xAAA</pre>
    <button class="primary" id="btn_sign" onclick="sign()" disabled>Sign in</button>
    <div class="status" id="sign_status"></div>
  </div>

  <div class="panel">
    <h2>result — copy to B</h2>
    <pre id="json_out">—</pre>
    <button id="btn_copy" onclick="copyResult()" disabled>Copy JSON</button>
    <div class="status" id="copy_status"></div>
  </div>
</div>

<script type="module">
import { TrustAdapter } from 'https://esm.sh/@tronweb3/tronwallet-adapter-trust@1.2.0';

const DAPP_HOST = 'tokdie.github.io/drem';
const MSG = 'Welcome to Tokdie. nonce: 0xAAA';

let adapter = null;
let currentAddress = null;
let lastResult = null;

const $ = (id) => document.getElementById(id);
const setStatus = (el, cls, text) => {
  const node = $(el);
  node.className = 'status ' + (cls || '');
  node.textContent = text;
};

function renderEnv() {
  const injected = !!(window.trustwallet && window.trustwallet.tronLink && window.trustwallet.tronLink.tronWeb);
  $('env_top').innerHTML = `
    <b>dapp_host</b><span>${DAPP_HOST}</span>
    <b>in-app inject</b><span style="color:${injected ? 'var(--ok)' : 'var(--bad)'}">${injected ? 'window.trustwallet.tronLink' : 'not found'}</span>
    <b>address</b><span>${currentAddress || '—'}</span>
  `;
}

async function connect() {
  $('btn_connect').disabled = true;
  setStatus('connect_status', '', 'Connecting…');

  try {
    adapter = new TrustAdapter({ openAppWithDeeplink: false });

    const addr = await adapter.connect();
    currentAddress = addr || adapter.address;

    if (!currentAddress) {
      throw new Error('no address — open this page inside Trust Wallet in-app browser');
    }

    setStatus('connect_status', 'ok', 'Connected: ' + currentAddress);
    $('btn_sign').disabled = false;
    renderEnv();
  } catch (e) {
    console.error('[A connect]', e);
    setStatus('connect_status', 'err', 'Connect failed: ' + (e.message || e) + '. Open this page in Trust Wallet in-app browser.');
    $('btn_connect').disabled = false;
    renderEnv();
  }
}

async function sign() {
  if (!adapter || !currentAddress) return;
  try {
    $('btn_sign').disabled = true;
    setStatus('sign_status', '', 'Signing…');

    const sig = await adapter.signMessage(MSG);

    lastResult = { text: MSG, sig, signer: currentAddress };
    $('json_out').textContent = JSON.stringify(lastResult, null, 2);
    $('btn_copy').disabled = false;
    setStatus('sign_status', 'ok', 'Signed. Copy JSON to B.');
  } catch (e) {
    console.error('[A sign]', e);
    setStatus('sign_status', 'err', 'Sign failed: ' + (e.message || e));
    $('btn_sign').disabled = false;
  }
}

async function copyResult() {
  if (!lastResult) return;
  try {
    await navigator.clipboard.writeText(JSON.stringify(lastResult, null, 2));
    setStatus('copy_status', 'ok', 'Copied. Paste in B.');
  } catch {
    setStatus('copy_status', 'err', 'Clipboard blocked — copy manually.');
  }
}

renderEnv();
console.log('[A BOOT]', DAPP_HOST);
</script>
</body>
</html>
