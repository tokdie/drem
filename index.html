<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>bridge sign — test bench (tokdie.github.io)</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#2b3138; --txt:#c9d1d9;
          --ok:#3fb950; --warn:#d29922; --bad:#f85149; --dim:#7d8590; }
  * { box-sizing:border-box; }
  body { margin:0; font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;
         background:var(--bg); color:var(--txt); }
  h2 { font-size:13px; margin:0 0 8px; color:var(--dim);
       text-transform:uppercase; letter-spacing:.08em; }
  .wrap { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:12px;
          max-width:1100px; margin:0 auto; }
  @media (max-width:760px) { .wrap { grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line);
           border-radius:6px; padding:12px; }
  .panel.full { grid-column:1 / -1; }
  button { background:#21262d; color:var(--txt); border:1px solid var(--line);
           border-radius:4px; padding:6px 12px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--dim); }
  button.danger { border-color:var(--bad); color:var(--bad); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  pre { background:#0a0d12; border:1px solid var(--line); border-radius:4px;
        padding:8px; margin:4px 0; max-height:260px; overflow:auto;
        white-space:pre-wrap; word-break:break-all; font-size:12px; }
  .row { display:flex; gap:8px; align-items:center; margin:6px 0; flex-wrap:wrap; }
  .kv { display:grid; grid-template-columns:120px 1fr; gap:2px 8px; }
  .kv b { color:var(--dim); font-weight:400; }
  .badge { padding:1px 8px; border-radius:3px; font-size:11px; }
  .badge.on  { background:#1a2f1a; color:var(--ok); }
  .badge.off { background:#3a1a1a; color:var(--bad); }
  #log { grid-column:1 / -1; }
</style>
</head>
<body>

<div class="wrap">

  <div class="panel full">
    <h2>environment</h2>
    <div class="kv" id="env"></div>
  </div>

  <div class="panel">
    <h2>Vector 1 — direct bridge call</h2>
    <p style="color:var(--dim);margin:0 0 8px">
      Мост доступен из JS. UI не вызывается. Натив получает запрос напрямую.
    </p>
    <div class="row">
      <button onclick="v1_legit()">legit: login (через UI)</button>
      <button class="danger" onclick="v1_bypass()">bypass: sign (минуя UI)</button>
    </div>
    <div class="row">
      <button class="danger" onclick="v1_eth_sign()">eth_sign: raw hash</button>
      <button class="danger" onclick="v1_oracle()">oracle: Permit payload</button>
    </div>
    <div class="row">
      <button class="danger" onclick="v1_real()" id="btn_real" disabled>
        real: window.ethereum (Trust Wallet)
      </button>
    </div>
    <pre id="v1_out">—</pre>
  </div>

  <div class="panel">
    <h2>Vector 2 — TOCTOU param swap</h2>
    <p style="color:var(--dim);margin:0 0 8px">
      UI показывает объект. Натив подписывает объект. Мутация между ними.
    </p>
    <div class="row">
      <button onclick="v2_legit()">legit: sign as shown</button>
      <button class="danger" onclick="v2_mutate()">swap after render</button>
    </div>
    <div class="row">
      <button class="danger" onclick="v2_proto()">proto: getter swap</button>
      <button class="danger" onclick="v2_replay()">replay: reuse sig</button>
    </div>
    <pre id="v2_out">—</pre>
  </div>

  <div class="panel full">
    <h2>native bridge mock — state</h2>
    <div class="kv" id="state"></div>
  </div>

  <div class="panel full" id="log">
    <h2>event log</h2>
    <pre id="log_out">—</pre>
  </div>

</div>

<script>
/* ─────────────  config  ───────────── */
const DOMAIN = 'https://tokdie.github.io';
const ORIGIN = location.origin;      // реальный origin страницы
const IS_REAL = !!window.ethereum;   // Trust Wallet / MetaMask мост

/* ─────────────  native bridge mock  ───────────── */

const Native = (() => {
  const state = {
    origin: ORIGIN,
    chainId: 1,
    allowedOrigins: [ORIGIN, DOMAIN],
    requireUI: true,
    validateContext: true,
    sigCount: 0,
    lastSig: null,
  };

  const log = (kind, msg, data) => {
    const el = document.getElementById('log_out');
    const line = `[${new Date().toISOString().slice(11,23)}] ${kind.padEnd(6)} ${msg}`;
    const body = data ? '\n  ' + JSON.stringify(data, null, 2).split('\n').join('\n  ') : '';
    el.textContent = (el.textContent === '—' ? '' : el.textContent) + line + body + '\n';
    el.scrollTop = el.scrollHeight;
  };

  const render = () => {
    document.getElementById('state').innerHTML = `
      <b>origin</b><span>${state.origin}</span>
      <b>chainId</b><span>${state.chainId}</span>
      <b>requireUI</b><span>${state.requireUI}</span>
      <b>validateCtx</b><span>${state.validateContext}</span>
      <b>sigCount</b><span>${state.sigCount}</span>
      <b>lastSig</b><span>${state.lastSig || '—'}</span>
    `;
  };

  const showUI = (payload) => {
    const view = JSON.stringify(payload, null, 2);
    log('UI', 'user sees', JSON.parse(view));
    return view;
  };

  const sign = (payload) => {
    state.sigCount++;
    const raw = JSON.stringify(payload);
    let h = 0;
    for (let i = 0; i < raw.length; i++) h = (h * 31 + raw.charCodeAt(i)) | 0;
    state.lastSig = '0x' + (h >>> 0).toString(16).padStart(8, '0') + '…';
    log('SIGN', 'native signs', { bytes: raw.length, sig: state.lastSig, payload });
    render();
    return state.lastSig;
  };

  const request = ({ method, params, origin, showUI: wantUI = true }) => {
    log('REQ', method, { origin, params });

    if (!state.allowedOrigins.includes(origin)) {
      log('DENY', 'origin not allowed', { origin });
      return { error: 'origin' };
    }

    if (state.validateContext) {
      const hasCtx = params && params.domain &&
        params.domain.chainId === state.chainId &&
        params.domain.verifyingContract;
      if (method === 'eth_signTypedData_v4' && !hasCtx) {
        log('DENY', 'no domain context', { params });
        return { error: 'context' };
      }
      if (method === 'eth_sign') {
        log('DENY', 'eth_sign disabled', {});
        return { error: 'method' };
      }
    }

    let shown = null;
    if (state.requireUI && wantUI) {
      shown = showUI(params);
    } else if (state.requireUI && !wantUI) {
      log('BYPASS', 'UI skipped — direct bridge call', { wantUI });
    }

    const sig = sign(params);

    if (shown) {
      const signedView = JSON.stringify(params, null, 2);
      if (shown !== signedView) {
        log('MISMATCH', 'shown != signed', { shown: JSON.parse(shown), signed: params });
      }
    }
    return { sig };
  };

  return { state, request, log, render };
})();

/* ─────────────  helpers  ───────────── */

const out = (id, obj) => {
  document.getElementById(id).textContent =
    typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2);
};

const LoginPayload = () => ({
  method: 'personal_sign',
  params: { message: 'Welcome to tokdie-dapp. nonce: 0xabc123' },
  origin: ORIGIN,
  showUI: true,
});

const SignPayload = () => ({
  method: 'eth_signTypedData_v4',
  params: {
    domain: { name: 'Tokdie', chainId: 1, verifyingContract: '0xLEGIT' },
    types: { Order: [{ name: 'to', type: 'address' }, { name: 'amount', type: 'uint256' }] },
    primaryType: 'Order',
    message: { to: '0xLEGIT', amount: '100' },
  },
  origin: ORIGIN,
  showUI: true,
});

const EvilPayload = () => ({
  method: 'eth_signTypedData_v4',
  params: {
    domain: { name: 'Tokdie', chainId: 1, verifyingContract: '0xLEGIT' },
    types: { Order: [{ name: 'to', type: 'address' }, { name: 'amount', type: 'uint256' }] },
    primaryType: 'Order',
    message: { to: '0xATTACKER', amount: '999999' },
  },
  origin: ORIGIN,
  showUI: false,
});

/* ─────────────  vector 1 — direct bridge  ───────────── */

function v1_legit() {
  out('v1_out', '→ legit login via UI\n');
  const r = Native.request(LoginPayload());
  out('v1_out', JSON.stringify(r, null, 2));
}

function v1_bypass() {
  out('v1_out', '→ bypass: sign без UI, прямой вызов моста\n');
  const r = Native.request(EvilPayload());
  out('v1_out', JSON.stringify(r, null, 2));
}

function v1_eth_sign() {
  out('v1_out', '→ eth_sign с сырым хешем\n');
  const r = Native.request({
    method: 'eth_sign',
    params: { hash: '0xdeadbeef' + '00'.repeat(28) },
    origin: ORIGIN,
    showUI: false,
  });
  out('v1_out', JSON.stringify(r, null, 2));
}

function v1_oracle() {
  out('v1_out', '→ oracle: Permit, spender=attacker\n');
  const r = Native.request({
    method: 'eth_signTypedData_v4',
    params: {
      domain: { name: 'Tokdie', chainId: 1, verifyingContract: '0xLEGIT' },
      types: { Permit: [
        { name: 'spender', type: 'address' },
        { name: 'value', type: 'uint256' },
        { name: 'nonce', type: 'uint256' },
        { name: 'deadline', type: 'uint256' },
      ]},
      primaryType: 'Permit',
      message: { spender: '0xATTACKER', value: 'MAX', nonce: 0, deadline: 9999999999 },
    },
    origin: ORIGIN,
    showUI: false,
  });
  out('v1_out', JSON.stringify(r, null, 2));
}

/* ─────────────  vector 1 real — window.ethereum  ───────────── */

async function v1_real() {
  if (!window.ethereum) {
    out('v1_out', 'window.ethereum not found — открыто не в кошельке');
    return;
  }
  out('v1_out', '→ real: eth_requestAccounts → eth_signTypedData_v4\n');
  Native.log('REAL', 'ethereum detected', { isTrust: window.ethereum.isTrust || false });
  try {
    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
    Native.log('REAL', 'accounts', accounts);
    const from = accounts[0];

    const typed = {
      domain: { name: 'Tokdie', version: '1', chainId: 1,
                verifyingContract: '0x0000000000000000000000000000000000000000' },
      types: { Order: [{ name: 'to', type: 'address' }, { name: 'amount', type: 'uint256' }] },
      primaryType: 'Order',
      message: { to: '0xATTACKER000000000000000000000000000000', amount: '999999' },
    };

    // это откроет экран подписи в Trust Wallet — стенд сам не подтверждает
    const sig = await window.ethereum.request({
      method: 'eth_signTypedData_v4',
      params: [from, JSON.stringify(typed)],
    });
    Native.log('REAL', 'signature returned', { sig });
    out('v1_out', 'sig:\n' + sig + '\n\n(подпись получена — стенд не отправляет её никуда)');
  } catch (e) {
    Native.log('REAL', 'rejected/error', { message: e.message, code: e.code });
    out('v1_out', 'error: ' + (e.message || e.code));
  }
}

/* ─────────────  vector 2 — TOCTOU  ───────────── */

function v2_mutate() {
  out('v2_out', '→ mutate after render\n');
  const payload = SignPayload();

  Native.log('UI', 'render for user', payload.params);
  const shownAtRender = JSON.stringify(payload.params, null, 2);

  payload.params.message.to = '0xATTACKER';
  payload.params.message.amount = '999999';

  const r = Native.request(payload);
  const signedView = JSON.stringify(payload.params, null, 2);

  out('v2_out',
    'shown at render:\n' + shownAtRender +
    '\n\nsigned:\n' + signedView +
    '\n\n' + (shownAtRender === signedView
      ? 'match — no swap'
      : 'MISMATCH — swapped between render and sign') +
    '\n\nresult: ' + JSON.stringify(r, null, 2));
}

function v2_legit() {
  out('v2_out', '→ legit: sign as shown\n');
  const payload = SignPayload();
  Native.log('UI', 'render for user', payload.params);
  const shownAtRender = JSON.stringify(payload.params, null, 2);
  const r = Native.request(payload);
  const signedView = JSON.stringify(payload.params, null, 2);
  out('v2_out',
    'shown:\n' + shownAtRender +
    '\n\nsigned:\n' + signedView +
    '\n\n' + (shownAtRender === signedView ? 'match' : 'MISMATCH') +
    '\n\nresult: ' + JSON.stringify(r, null, 2));
}

function v2_proto() {
  out('v2_out', '→ proto getter swap\n');

  let reads = 0;
  const base = {
    domain: { name: 'Tokdie', chainId: 1, verifyingContract: '0xLEGIT' },
    types: { Order: [{ name: 'to', type: 'address' }, { name: 'amount', type: 'uint256' }] },
    primaryType: 'Order',
  };

  const trap = {
    get to() {
      reads++;
      return reads === 1 ? '0xLEGIT' : '0xATTACKER';
    },
    get amount() {
      reads++;
      return reads <= 2 ? '100' : '999999';
    },
  };

  const payload = {
    method: 'eth_signTypedData_v4',
    params: { ...base, message: trap },
    origin: ORIGIN,
    showUI: true,
  };

  const shownAtRender = JSON.stringify(
    { ...base, message: { to: trap.to, amount: trap.amount } }, null, 2);
  Native.log('UI', 'render for user', JSON.parse(shownAtRender));

  const signed = JSON.stringify(
    { ...base, message: { to: trap.to, amount: trap.amount } }, null, 2);

  out('v2_out',
    'shown at render:\n' + shownAtRender +
    '\n\nsigned:\n' + signed +
    '\n\n' + (shownAtRender === signed ? 'match' : 'MISMATCH — getter returned different values') +
    '\n\nreads: ' + reads);
}

function v2_replay() {
  out('v2_out', '→ replay: no nonce, no domain binding\n');

  const first = Native.request({
    method: 'personal_sign',
    params: { message: 'transfer 100 USDC to 0xLEGIT' },
    origin: ORIGIN,
    showUI: true,
  });

  const replay = Native.request({
    method: 'personal_sign',
    params: { message: 'transfer 100 USDC to 0xLEGIT' },
    origin: 'https://other-dapp.example',
    showUI: false,
  });

  out('v2_out',
    'first sig:  ' + JSON.stringify(first) +
    '\nreplay sig: ' + JSON.stringify(replay) +
    '\n\n' + (first.sig === replay.sig
      ? 'SAME SIG — replay valid across contexts (no nonce, no domain)'
      : 'different sig — replay blocked by context'));
}

/* ─────────────  env panel + boot  ───────────── */

function renderEnv() {
  document.getElementById('env').innerHTML = `
    <b>location.origin</b><span>${ORIGIN}</span>
    <b>configured domain</b><span>${DOMAIN}</span>
    <b>window.ethereum</b><span class="badge ${IS_REAL ? 'on' : 'off'}">${IS_REAL ? 'present' : 'absent'}</span>
    <b>isTrust</b><span>${IS_REAL && window.ethereum.isTrust ? 'yes' : 'no'}</span>
    <b>isMetaMask</b><span>${IS_REAL && window.ethereum.isMetaMask ? 'yes' : 'no'}</span>
    <b>chainId (from bridge)</b><span id="env_chain">—</span>
  `;
  if (IS_REAL) {
    document.getElementById('btn_real').disabled = false;
    window.ethereum.request({ method: 'eth_chainId' })
      .then(id => { document.getElementById('env_chain').textContent = id; })
      .catch(() => {});
  }
}

Native.render();
renderEnv();
Native.log('BOOT', 'bridge mock up', { origin: ORIGIN, real: IS_REAL });
</script>
</body>
</html>
